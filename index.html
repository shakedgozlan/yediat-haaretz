 השיא של יגאל אלון: 19 ימים כראש ממשלה בפועל ב-1969, אחרי מות אשכול.","difficulty":2,"source":"https://en.wikipedia.org/wiki/List_of_prime_ministers_of_Israel"},{"id":"lead-027","cat":"leaders","q":"ממשלת החילופים של בנט ולפיד אושרה בכנסת ב-2021. באיזה רוב?","options":["61 מול 59","62 מול 58","60 מול 59","65 מול 55"],"answer":2,"explain":"בנט כיהן ראשון, ולפיד, \"ראש הממשלה החלופי\", החליף אותו ב-1.7.2022. שניהם כיהנו באותה ממשלה, ה-36.","difficulty":2,"source":"https://he.wikipedia.org/wiki/נפתלי_בנט"},{"id":"lead-028","cat":"leaders","q":"מי טבע את המילה \"מהפך\" בליל הבחירות של 1977?","options":["מנחם בגין","יצחק רבין","המגיש דן שילון","המגיש חיים יבין"],"answer":3,"explain":"יבין הכריז על ניצחון הליכוד לפי מדגם הטלוויזיה. זו הייתה הפעם הראשונה שתוצאות מדגם שודרו בשידור חי בטלוויזיה בישראל.","difficulty":2,"source":"https://www.timesofisrael.com/veteran-news-anchor-haim-yavin-israels-mr-television-dies-at-93/"},{"id":"lead-029","cat":"leaders","q":"כמה פעמים נבחר בישראל ראש הממשלה בבחירה ישירה של הציבור?","options":["3","1","2","5"],"answer":0,"explain":"ב-1996 (נתניהו), ב-1999 (ברק) וב-2001 (שרון). ב-1996 הצביעו לראשונה בשני פתקים, אחד לכנסת ואחד לראש הממשלה. אחר כך בוטלה השיטה.","difficulty":2,"source":"https://main.knesset.gov.il/Activity/Info/mmm/Documents/Elections_21_Spotlight.pdf"},{"id":"lead-030","cat":"leaders","q":"מי היה הנשיא הראשון שנולד בארץ ישראל, וגם הראשון מעדות ספרד והמזרח?","options":["אפרים קציר","יצחק נבון","חיים הרצוג","ראובן ריבלין"],"answer":1,"explain":"נבון נולד בירושלים ב-1921. הוא גם היה הנשיא הראשון שנכנס לבית הנשיא עם ילדים קטנים.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Yitzhak_Navon"},{"id":"lead-031","cat":"leaders","q":"איזה נשיא היה ביופיזיקאי במכון ויצמן והמפקד הראשון של חיל המדע בצה\"ל?","options":["חיים ויצמן","זלמן שזר","אפרים קציר","יצחק נבון"],"answer":2,"explain":"קציר, חתן פרס ישראל, נכנס לתפקיד הנשיא במאי 1973, חמישה חודשים לפני מלחמת יום הכיפורים.","difficulty":2,"source":"https://he.wikipedia.org/wiki/אפרים_קציר"},{"id":"lead-032","cat":"leaders","q":"1954: מפקד בסיס רמת דוד מבקש להשאיר לעצמו מטוס ספיטפייר אחד, וצובע אותו בשחור, כי \"למפקד צריך סימן היכר\". מי הוא, לימים נשיא המדינה?","options":["חיים הרצוג","משה קצב","אפרים קציר","עזר ויצמן"],"answer":3,"explain":"\"הספיטפייר השחור\" נצבע כמו מטוסו של מפקד בסיס בריטי. ויצמן המשיך לטוס בו גם אחרי שפרש, וב-2005 טס המטוס מעל הלווייתו. היום הוא שייך למוזיאון חיל האוויר, וחזר לטוס במפגנים.","difficulty":2,"funny":true,"source":"https://vintageaviationnews.com/warbirds-news/ezer-weitzmans-black-spitfire-air.html"},{"id":"lead-033","cat":"leaders","q":"יום העצמאות 2015 במשכן הנשיא: חיילים מצטיינים, ברכות, ריקודים ומנגל. מה היה מיוחד במנגל של הנשיא ריבלין?","options":["לא היה בו בשר בכלל","כל אורח הביא בשר משלו","הנשיא חילק בעצמו פרגיות","הבשר הגיע במשלוח מכל מחוז"],"answer":0,"explain":"ריבלין צמחוני כבר עשרות שנים, וכנשיא החליט שסעודת החג במשכן הנשיא תהיה בלי בשר על האש.","difficulty":2,"funny":true,"source":"https://www.mako.co.il/news-israel/local-q2_2015/Article-d367893f573ec41004.htm"},{"id":"lead-034","cat":"leaders","q":"איפה ערך הנשיא יצחק בן-צבי את קבלות הפנים הרשמיות של המדינה?","options":["בקומה העליונה של מגדל שלום","בצריפי עץ בחצר ביתו ברחביה","בארמון שהוחרם מהנציב הבריטי","באוהל ענק בגן סאקר"],"answer":1,"explain":"בן-צבי סירב לעבור לבתי האבן שהציעה לו הממשלה. המדינה קנתה בית סמוך ברחביה והקימה בחצר שני צריפי עץ, \"הצריפים השוודיים\". שם קיבלו בן-צבי, ואחריו גם שזר, מלכים ושגרירים.","difficulty":2,"funny":true,"source":"https://www.president.gov.il/en/history/"},{"id":"lead-035","cat":"leaders","q":"במבצע \"אביב נעורים\" בביירות (1973) התחפש מפקד סיירת מטכ\"ל, אהוד ברק. לאיזו דמות?","options":["לתייר אמריקאי בגופייה","למוכר פלאפל","לאישה שחרחורת","לכומר עם זקן"],"answer":2,"explain":"סגנו מוקי בצר התחפש לבלונדינית. לפי רעייתו דאז, נאוה, ברק חזר הביתה עם איפור כחול מעל העיניים, והיא שאלה: \"אהוד, למה אתה מאופר בכחול?\"","difficulty":2,"funny":true,"source":"https://www.ynet.co.il/articles/0,7340,L-4508775,00.html"},{"id":"lead-036","cat":"leaders","q":"כשמנחם בגין התפטר ב-1983, התגלה פרט מפתיע. מה?","options":["המפתחות למשרד נשארו לו בכיס","הכלב של המעון סירב לעזוב איתו","הוא שכח לחתום על מכתב ההתפטרות","לא הייתה לו דירה לחזור אליה"],"answer":3,"explain":"הדירה הצנועה שבה גר בתל אביב, ברחוב רוזנבאום, הוחזרה לבעליה כשעבר למעון הרשמי. לפי דן מרידור נמצאה לו דירה שכורה בירושלים, ואת שכר הדירה שילם מהפנסיה.","difficulty":2,"funny":true,"source":"https://www.globes.co.il/news/article.aspx?did=1001279655"},{"id":"lead-037","cat":"leaders","q":"מה עשה חיים הרצוג, אז שגריר ישראל באו\"ם, מעל דוכן העצרת הכללית ב-1975?","options":["קרע את החלטת \"הציונות היא גזענות\"","יצא מהאולם במחאה","הניף את דגל ישראל","נאם בעברית בלבד"],"answer":0,"explain":"הרצוג קרע את נוסח החלטה 3379 ב-10.11.1975. ההחלטה בוטלה ב-16.12.1991.","difficulty":2,"source":"https://www.ynet.co.il/news/article/yokra14574806"},{"id":"lead-038","cat":"leaders","q":"מה היה הכינוי המחתרתי של יצחק שמיר בלח\"י?","options":["יאיר","מיכאל","גדעון","בן ענת"],"answer":1,"explain":"הכינוי נבחר על שם מייקל קולינס, מנהיג המאבק האירי בבריטים. \"יאיר\" היה כינויו של אברהם שטרן.","difficulty":3,"source":"https://www.ynet.co.il/articles/0,7340,L-3772758,00.html"},{"id":"lead-039","cat":"leaders","q":"איך כינה לוי אשכול ביידיש את ישראל, מדינה חזקה שצריכה להיראות חלשה ומאוימת?","options":["\"דוד דער גיבור\"","\"שמשון דער שטארקער\"","\"שמשון דער נעבעכדיקער\"","\"גוליית דער קליינער\""],"answer":2,"explain":"הפירוש: \"שמשון המסכן\". כוח של שמשון, תדמית של נעבעך.","difficulty":3,"source":"https://hashiloach.org.il/tchelet/%D7%90%D7%A9%D7%9B%D7%95%D7%9C-%D7%94%D7%92%D7%99%D7%91%D7%95%D7%A8-%D7%94%D7%A0%D7%A9%D7%9B%D7%97/"},{"id":"lead-040","cat":"leaders","q":"מי מחזיק בשיא הכהונה כחבר כנסת, כ-48 שנים (1959–2007)?","options":["מנחם בגין","בנימין נתניהו","יצחק שמיר","שמעון פרס"],"answer":3,"explain":"פרס עזב את הכנסת רק כשנבחר לנשיא ב-2007. לפי ה-BBC הוא כיהן כמעט בכל תפקיד ציבורי בישראל.","difficulty":3,"source":"https://www.peres-center.org/en/shimon-peres/about/"},{"id":"lead-041","cat":"leaders","q":"בבחירות 2001 קרה משהו שלא קרה בישראל לפני כן ולא אחרי כן. מה?","options":["בחרו רק ראש ממשלה, בלי כנסת","הבחירות נמשכו יומיים","ההצבעה הייתה אלקטרונית","התמודדה בהן רשימה אחת בלבד"],"answer":0,"explain":"אריאל שרון נבחר בהן לראשות הממשלה, והכנסת נשארה בהרכבה. זו הייתה גם הפעם האחרונה שבה נבחר ראש ממשלה בבחירה ישירה.","difficulty":3,"source":"https://main.knesset.gov.il/Activity/Info/mmm/Documents/Elections_21_Spotlight.pdf"},{"id":"lead-042","cat":"leaders","q":"בכהונת איזה נשיא נבנה המשכן הנוכחי של נשיאי ישראל בירושלים?","options":["יצחק בן-צבי","זלמן שזר","אפרים קציר","חיים ויצמן"],"answer":1,"explain":"שזר התעקש שהבית לא ייבנה בקריית הממשלה אלא בשכונת מגורים, בטלביה, וציטט את הפסוק \"בתוך עמי אנוכי יושב\". תכנן אותו האדריכל אבא אלחנני, והבנייה הסתיימה ב-1972.","difficulty":3,"source":"https://www.president.gov.il/en/history/"},{"id":"lead-043","cat":"leaders","q":"איזה נשיא חזר לפוליטיקה אחרי סיום כהונתו, וכיהן כשר החינוך והתרבות?","options":["חיים הרצוג","זלמן שזר","יצחק נבון","עזר ויצמן"],"answer":2,"explain":"נבון כיהן כשר החינוך והתרבות מ-1984 עד 1990, והוא הנשיא היחיד שעשה זאת.","difficulty":3,"source":"https://www.jsmuseum.org/he/person/isaac-navon/"},{"id":"lead-044","cat":"leaders","q":"לאן נשלחה גולדה מאיר ב-1948 כנציגה הדיפלומטית הראשונה של ישראל?","options":["וושינגטון","לונדון","פריז","מוסקבה"],"answer":3,"explain":"אחר כך הייתה שרת העבודה (1949–1956) ושרת החוץ (1956–1966). את שם המשפחה \"מאיר\" אימצה ב-1956, כשמונתה לשרת החוץ.","difficulty":3,"source":"http://news.bbc.co.uk/2/hi/events/israel_at_50/profiles/81288.stm"},{"id":"lead-045","cat":"leaders","q":"איזה נשיא כיהן הכי הרבה זמן, והוא גם היחיד שנבחר שלוש פעמים?","options":["יצחק בן-צבי","זלמן שזר","חיים הרצוג","חיים ויצמן"],"answer":0,"explain":"בן-צבי נבחר ב-1952, ב-1957 וב-1962, וכיהן יותר מעשר שנים, עד פטירתו ב-1963. מאז 2000 נבחר הנשיא לכהונה אחת בלבד, בת שבע שנים.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Itzhak_Ben-Zvi"},{"id":"tanakh-001","cat":"tanakh","q":"לפי המניין היהודי, כמה ספרים יש בתנ\"ך?","options":["22","24","27","36"],"answer":1,"explain":"שמואל, מלכים ודברי הימים נספרים כל אחד כספר אחד, וכך גם עזרא-נחמיה ותרי עשר, שבו 12 נביאים. החלוקה: 5 ספרים בתורה, 8 בנביאים ו-11 בכתובים.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Hebrew_Bible"},{"id":"tanakh-002","cat":"tanakh","q":"מהו הפרק הקצר ביותר בתנ\"ך, עם שני פסוקים בלבד?","options":["תהלים כג","תהלים קלג","עובדיה א","תהלים קיז"],"answer":3,"explain":"מזמור קיז, \"הללו את יהוה כל גוים\", נגמר אחרי שני פסוקים. ושני מזמורים אחריו נמצא הפרק הארוך ביותר בתנ\"ך: תהלים קיט, עם 176 פסוקים.","difficulty":3,"source":"https://www.sefaria.org/Psalms.117.1-2?lang=he"},{"id":"tanakh-003","cat":"tanakh","q":"באיזה ספר לא מופיעים בכלל שם ה' והמילה \"אלהים\"?","options":["מגילת רות","ספר יונה","מגילת אסתר","ספר נחמיה"],"answer":2,"explain":"בכל 167 הפסוקים של המגילה אין שם ה'. גם ברגע הכי דרמטי מרדכי מדבר רק על כך ש\"רוח והצלה יעמוד ליהודים ממקום אחר\".","difficulty":2,"source":"https://www.sefaria.org/Esther.4.14?lang=he"},{"id":"tanakh-004","cat":"tanakh","q":"איזה מהביטויים המוכרים האלה לא מופיע בתורה אפילו פעם אחת?","options":["\"עשרת הדברים\"","\"ארץ זבת חלב ודבש\"","\"עין תחת עין\"","\"עשר המכות\""],"answer":3,"explain":"התורה אכן מתארת עשר מכות, אבל לא סופרת אותן ולא קוראת להן \"עשר המכות\". המספר מגיע מהמסורת ומההגדה של פסח. \"עשרת הדברים\", לעומת זאת, כתוב במפורש (שמות לד, כח).","difficulty":2,"source":"https://www.sefaria.org/Exodus.34.28?lang=he"},{"id":"tanakh-005","cat":"tanakh","q":"איזה ספר הוא הקצר ביותר מבין ספרי הנביאים, עם פרק אחד בלבד?","options":["יונה","חגי","עובדיה","נחום"],"answer":2,"explain":"21 פסוקים, וזה כל הספר. במניין 24 הספרים עובדיה הוא בכלל חלק מתרי עשר, אבל כשסופרים כל נביא כספר בפני עצמו, הוא הספר הקצר ביותר בתנ\"ך כולו.","difficulty":2,"source":"https://www.sefaria.org/Obadiah.1.1?lang=he"},{"id":"tanakh-006","cat":"tanakh","q":"האור נברא כבר ביום הראשון. באיזה יום, לפי בראשית א, נבראו השמש והירח?","options":["ביום הראשון","ביום השני","ביום השישי","ביום הרביעי"],"answer":3,"explain":"\"המאורות הגדולים\" נבראו רק ביום הרביעי. כלומר, לפי הסיפור היו שלושה ימים של אור, ערב ובוקר עוד לפני שהייתה שמש.","difficulty":2,"source":"https://www.sefaria.org/Genesis.1.16?lang=he"},{"id":"tanakh-007","cat":"tanakh","q":"כולם יודעים שחוה אכלה תפוח. מה כתוב בפועל בבראשית ג?","options":["תפוח מעץ הדעת","תאנה מעץ הדעת","רימון מעץ הדעת","רק \"מפריו\", בלי לומר איזה פרי"],"answer":3,"explain":"המילה \"תפוח\" לא מופיעה בכלל בספר בראשית. במדרשים יש הצעות כמו תאנה, חיטה או ענבים, אבל זו פרשנות. התאנה כן מופיעה מיד אחר כך: מעליה תפרו אדם וחוה את החגורות הראשונות.","difficulty":2,"source":"https://www.sefaria.org/Genesis.3.6?lang=he"},{"id":"tanakh-008","cat":"tanakh","q":"מי ענה \"השמר אחי אנכי?\" כשאלוהים שאל אותו איפה אחיו?","options":["קין","עשו","יוסף","לוט"],"answer":0,"explain":"אלוהים שאל \"אי הבל אחיך\", וקין ענה \"לא ידעתי\". לפני כן הבל היה רועה צאן, וקין עובד אדמה.","difficulty":1,"source":"https://www.sefaria.org/Genesis.4.9?lang=he"},{"id":"tanakh-009","cat":"tanakh","q":"איזו ציפור שלח נח ראשונה מהתיבה?","options":["עורב","יונה","נשר","דרור"],"answer":0,"explain":"רוב האנשים בטוחים שזו הייתה היונה, אבל הראשון היה העורב. רק אחריו נשלחה היונה, ובפעם השנייה שנשלחה חזרה עם עלה זית בפיה.","difficulty":2,"source":"https://www.sefaria.org/Genesis.8.7?lang=he"},{"id":"tanakh-010","cat":"tanakh","q":"מבין אברהם, יצחק, יעקב ויוסף, מי חי הכי הרבה שנים?","options":["אברהם","יעקב","יצחק","יוסף"],"answer":2,"explain":"יצחק חי 180 שנה, אברהם 175, יעקב 147 ויוסף 110. שיאן הגיל של התנ\"ך כולו הוא מתושלח, עם 969 שנים.","difficulty":3,"source":"https://www.sefaria.org/Genesis.35.28?lang=he"},{"id":"tanakh-011","cat":"tanakh","q":"יעקב עבד אצל לבן בשביל רחל, \"ויהיו בעיניו כימים אחדים\". כמה שנים עבד עד החתונה?","options":["3","7","10","12"],"answer":1,"explain":"בבוקר שאחרי החתונה התגלה \"והנה הוא לאה\", ויעקב עבד עוד 7 שנים. בסך הכול 14 שנים, כמו שהוא אומר ללבן: \"עבדתיך ארבע עשרה שנה בשתי בנתיך\".","difficulty":1,"source":"https://www.sefaria.org/Genesis.29.20?lang=he"},{"id":"tanakh-012","cat":"tanakh","q":"מה עשה יעקב ליוסף, \"כי בן זקנים הוא לו\"?","options":["מעיל תכלת","אפוד","טלית","כתונת פסים"],"answer":3,"explain":"יוסף מתואר באותו פרק כנער בן 17. ובאותו פרק גם נמכר, בעשרים כסף.","difficulty":1,"source":"https://www.sefaria.org/Genesis.37.3?lang=he"},{"id":"tanakh-013","cat":"tanakh","q":"בן כמה היה יוסף כשעמד לפני פרעה?","options":["17","40","30","22"],"answer":2,"explain":"17 הוא הגיל שבו נמכר, כך שעברו 13 שנים עד שעמד לפני פרעה. פרעה גם נתן לו שם מצרי, \"צפנת פענח\", ואישה, אסנת בת פוטי פרע.","difficulty":3,"source":"https://www.sefaria.org/Genesis.41.45-46?lang=he"},{"id":"tanakh-014","cat":"tanakh","q":"חותן משה מוכר בשם יתרו, כהן מדין. איזה שם נוסף יש לו בספר שמות?","options":["רעואל","לבן","בלעם","בתואל"],"answer":0,"explain":"בשמות ב הבנות חוזרות \"אל רעואל אביהן\", ובשמות ג הוא כבר \"יתרו חתנו כהן מדין\". אחת מבנותיו, צפורה, הייתה לאשת משה.","difficulty":2,"source":"https://www.sefaria.org/Exodus.2.18?lang=he"},{"id":"tanakh-015","cat":"tanakh","q":"חרטומי מצרים הצליחו לחקות את הדם ואת הצפרדע. באיזו מכה נכשלו ואמרו \"אצבע אלהים הוא\"?","options":["כינים","ערוב","ברד","חושך"],"answer":0,"explain":"כינים היא המכה השלישית, והראשונה שהחרטומים לא הצליחו לעשות. ב\"הצלחה\" שלהם עם הצפרדע הם בעצם העלו עוד צפרדעים על ארץ מצרים.","difficulty":2,"source":"https://www.sefaria.org/Exodus.8.14-15?lang=he"},{"id":"tanakh-016","cat":"tanakh","q":"התירוץ הכי \"זה קרה מעצמו\" בתנ\"ך: איך הסביר אהרן למשה את עגל הזהב?","options":["\"ואשלכהו באש ויצא העגל הזה\"","\"בצלאל עשה אותו בלי אישור\"","\"זאת מזכרת שהבאנו ממצרים\"","\"זה רק דגם להמחשה\""],"answer":0,"explain":"לפי אהרן, הוא רק זרק את הזהב לאש, והעגל \"יצא\" לבד. כמה פסוקים קודם הטקסט מספר שהוא עיצב אותו \"בחרט\". משה, אגב, כבר הספיק לשבור את הלוחות תחת ההר.","difficulty":1,"funny":true,"source":"https://www.sefaria.org/Exodus.32.24?lang=he"},{"id":"tanakh-017","cat":"tanakh","q":"בעשרת הדברים שבשמות כתוב \"זכור את יום השבת\". איזו מילה באה במקום \"זכור\" בגרסה שבספר דברים?","options":["קדש","שבות","זכרו","שמור"],"answer":3,"explain":"עשרת הדברים מופיעים פעמיים, בשמות כ ובדברים ה, ויש ביניהם הבדלים קטנים. גם הנימוק לשבת שונה: בשמות זו בריאת העולם בשישה ימים, ובדברים \"וזכרת כי עבד היית בארץ מצרים\".","difficulty":2,"source":"https://www.sefaria.org/Deuteronomy.5.12?lang=he"},{"id":"tanakh-018","cat":"tanakh","q":"יצאו מעבדות לחירות, ואז הגיעו הגעגועים. למה התגעגעו בני ישראל במדבר, לפי במדבר יא?","options":["לדגה, לקישואים, לאבטיחים ולשומים","לנוף של הפירמידות","לנוגשים שהעירו אותם בבוקר","לשייט על הנילוס"],"answer":0,"explain":"\"זכרנו את הדגה אשר נאכל במצרים חנם\", ואחריה רשימת ירקות שלמה, כולל הבצלים. התשובה מלמעלה: יקבלו בשר \"עד אשר יצא מאפכם\".","difficulty":2,"funny":true,"source":"https://www.sefaria.org/Numbers.11.5?lang=he"},{"id":"tanakh-019","cat":"tanakh","q":"מי בתנ\"ך מגישה תלונה על יחס משפיל: \"מה עשיתי לך כי הכיתני זה שלש רגלים\"?","options":["האתון של בלעם","הנחש בגן עדן","העורב של נח","הגמלים של רבקה"],"answer":0,"explain":"האתון ראתה את המלאך, ובלעם, שכל המקצוע שלו הוא לראות מה שאחרים לא רואים, לא. והוא עונה לה כאילו זו שיחה רגילה לגמרי, ואפילו מאיים: \"לו יש חרב בידי כי עתה הרגתיך\".","difficulty":1,"funny":true,"source":"https://www.sefaria.org/Numbers.22.28-30?lang=he"},{"id":"tanakh-020","cat":"tanakh","q":"בן כמה היה משה במותו?","options":["110","123","120","100"],"answer":2,"explain":"\"לא כהתה עינו ולא נס לחה\", ו\"לא ידע איש את קברתו עד היום הזה\". 123 הוא הגיל של אהרן במותו, ו-110 של יוסף ושל יהושע.","difficulty":1,"source":"https://www.sefaria.org/Deuteronomy.34.6-7?lang=he"},{"id":"tanakh-021","cat":"tanakh","q":"\"כי האדם עץ השדה\" נאמר בספר דברים. באיזה הקשר?","options":["ברכה לאדם צדיק","דיני שנת השמיטה","קינה על מות משה","איסור לכרות עצי מאכל במצור"],"answer":3,"explain":"הפסוק בא מדיני המלחמה: גם כשצרים על עיר, אסור לכרות את עצי המאכל שסביבה. היום מצטטים אותו בדרך כלל בלי ההקשר הצבאי.","difficulty":2,"source":"https://www.sefaria.org/Deuteronomy.20.19?lang=he"},{"id":"tanakh-022","cat":"tanakh","q":"ביום השביעי הקיפו בני ישראל את יריחו, תקעו בשופרות והחומה נפלה. כמה הקפות עשו באותו יום?","options":["1","3","12","7"],"answer":3,"explain":"בששת הימים הראשונים הקיפו את העיר פעם אחת ביום. ביום השביעי שבע פעמים, ואז \"ותפל החומה תחתיה\".","difficulty":1,"source":"https://www.sefaria.org/Joshua.6.15?lang=he"},{"id":"tanakh-023","cat":"tanakh","q":"איזו מהערים האלה נזכרת בתנ\"ך, ברשימת המלכים שהכה יהושע?","options":["חיפה","עפולה","יקנעם","טבריה"],"answer":2,"explain":"\"מלך יקנעם לכרמל אחד\". חיפה, עפולה וטבריה לא מופיעות בתנ\"ך בכלל. טבריה, למשל, נוסדה רק בתקופה הרומית.","difficulty":3,"source":"https://www.sefaria.org/Joshua.12.22?lang=he"},{"id":"tanakh-024","cat":"tanakh","q":"מה מספר הטקסט על אהוד בן גרא, שהרג את עגלון מלך מואב?","options":["היה גבוה מכל העם","היה איטר, \"אטר יד ימינו\"","היה עיוור בעין אחת","היה נזיר מבטן"],"answer":1,"explain":"הוא החביא חרב קצרה על ירך ימין ושלף אותה ביד שמאל. עגלון, לפי הטקסט, היה \"איש בריא מאד\", כלומר שמן מאוד.","difficulty":2,"source":"https://www.sefaria.org/Judges.3.15-17?lang=he"},{"id":"tanakh-025","cat":"tanakh","q":"מי הרגה את סיסרא ביתד האוהל?","options":["דבורה הנביאה","יעל אשת חבר הקיני","דלילה","רחב"],"answer":1,"explain":"דבורה, ששפטה את ישראל תחת \"תמר דבורה\", שלחה את ברק בן אבינעם להר תבור עם עשרת אלפים איש. את סיסרא עצמו גמרה יעל.","difficulty":1,"source":"https://www.sefaria.org/Judges.4.21?lang=he"},{"id":"tanakh-026","cat":"tanakh","q":"אנשי אפרים נתפסו במעברות הירדן כי לא הצליחו לבטא נכון מילה אחת. איזו?","options":["שלום","שיבולת","שמש","שופר"],"answer":1,"explain":"הם אמרו \"סבולת\", וזה הסגיר אותם. לפי הפסוק נפלו אז 42 אלף איש מאפרים. מכאן \"שיבולת\" במשמעות של סימן היכר או מבחן שמסגיר מי אתה.","difficulty":2,"source":"https://www.sefaria.org/Judges.12.6?lang=he"},{"id":"tanakh-027","cat":"tanakh","q":"איך נקראה העיר דן, לפני ששבט דן קרא לה על שם אביו?","options":["ליש","לוז","קרית ארבע","יבוס"],"answer":0,"explain":"\"ואולם ליש שם העיר לראשנה\". לוז הוא השם הקודם של בית אל, וקרית ארבע הוא שם נוסף של חברון. ופרט שהעסיק פרשנים: כבר בבראשית יד אברהם רודף \"עד דן\".","difficulty":2,"source":"https://www.sefaria.org/Judges.18.29?lang=he"},{"id":"tanakh-028","cat":"tanakh","q":"הגורל במצפה נופל על המלך הראשון של ישראל, ואז מתברר שהמלך לא נמצא. איפה מצאו את שאול?","options":["מחפש את האתונות של אביו","ישן במערה","בבית אביו בגבעה","מתחבא בין הכלים"],"answer":3,"explain":"\"הנה הוא נחבא אל הכלים\", כלומר בין המטענים. ומדובר באיש שהיה \"משכמו ומעלה גבה מכל העם\".","difficulty":1,"funny":true,"source":"https://www.sefaria.org/I_Samuel.10.22?lang=he"},{"id":"tanakh-029","cat":"tanakh","q":"כמה אבנים חלקות בחר דוד מן הנחל לפני שיצא מול גוליית?","options":["1","3","5","7"],"answer":2,"explain":"בסוף השתמש רק באחת מהן. הקרב היה בעמק האלה, וגוליית, שהגיע מגת, היה בגובה \"שש אמות וזרת\", בערך שלושה מטרים.","difficulty":1,"source":"https://www.sefaria.org/I_Samuel.17.40?lang=he"},{"id":"tanakh-030","cat":"tanakh","q":"במערה ליד עין גדי דוד יכול היה לפגוע בשאול. מה עשה במקום זה?","options":["לקח את חניתו ואת צפחת המים","גזר קווצה משערו","כרת בסתר את כנף מעילו","החליף את חרבו בחרב עץ"],"answer":2,"explain":"דוד ישב אז \"במצדות עין גדי\". את החנית ואת צפחת המים לקח בפעם אחרת, בשמואל א כו, ומתבלבלים בין שני הסיפורים הרבה.","difficulty":2,"source":"https://www.sefaria.org/I_Samuel.24.5?lang=he"},{"id":"tanakh-031","cat":"tanakh","q":"אחרי מות שאול בהר הגלבוע, על חומת איזו עיר תקעו הפלשתים את גווייתו?","options":["גת","בית שאן","עזה","יזרעאל"],"answer":1,"explain":"ובקינה של דוד: \"הרי בגלבע אל טל ואל מטר עליכם\". אותה קינה נתנה לעברית גם את \"איך נפלו גבורים\" ואת \"אל תגידו בגת\".","difficulty":2,"source":"https://www.sefaria.org/I_Samuel.31.10?lang=he"},{"id":"tanakh-032","cat":"tanakh","q":"שתי נשים, תינוק אחד ופסק דין: \"גזרו את הילד החי לשנים\". מי השופט?","options":["דוד","שלמה","שמואל","דבורה"],"answer":1,"explain":"האם האמיתית ויתרה כדי להציל את הילד, וכך התגלתה. קצת לפני כן, בחלום בגבעון, שלמה ביקש מאלוהים \"לב שמע לשפט את עמך\".","difficulty":1,"source":"https://www.sefaria.org/I_Kings.3.25-27?lang=he"},{"id":"tanakh-033","cat":"tanakh","q":"לפי מלכים א, כמה שנים אחרי יציאת מצרים התחיל שלמה לבנות את בית המקדש?","options":["430","40","480","300"],"answer":2,"explain":"זה היה בשנה הרביעית למלכותו, והבנייה נמשכה 7 שנים. את הבית של עצמו בנה שלמה 13 שנה, כמעט פי שניים.","difficulty":3,"source":"https://www.sefaria.org/I_Kings.6.1?lang=he"},{"id":"tanakh-034","cat":"tanakh","q":"כמה נשים ופילגשים היו לשלמה המלך, לפי מלכים א?","options":["300 נשים ו-700 פילגשים","700 נשים ו-300 פילגשים","500 נשים ו-500 פילגשים","70 נשים ו-30 פילגשים"],"answer":1,"explain":"\"נשים שרות שבע מאות ופלגשים שלש מאות\", ביחד אלף. שלמה גם מלך 40 שנה, בדיוק כמו אביו דוד.","difficulty":2,"source":"https://www.sefaria.org/I_Kings.11.3?lang=he"},{"id":"tanakh-035","cat":"tanakh","q":"הצופה בעיר מזהה מרכבה מרחוק רק לפי סגנון הנהיגה: \"כי בשגעון ינהג\". מי הנהג?","options":["יהוא בן נמשי","אחאב","אבשלום","ירבעם"],"answer":0,"explain":"\"והמנהג כמנהג יהוא בן נמשי, כי בשגעון ינהג\" (מלכים ב ט, כ). הצופה מזהה אותו לפי הנהיגה בלבד.","difficulty":2,"funny":true,"source":"https://www.sefaria.org/II_Kings.9.20?lang=he"},{"id":"tanakh-036","cat":"tanakh","q":"איזה כינוי מקבלת יריחו בתנ\"ך?","options":["עיר התמרים","עיר הזיתים","עיר הרימונים","עיר הענבים"],"answer":0,"explain":"\"בקעת ירחו עיר התמרים\" מופיע בתיאור הארץ שמשה ראה מהר נבו, רגע לפני מותו.","difficulty":2,"source":"https://www.sefaria.org/Deuteronomy.34.3?lang=he"},{"id":"tanakh-037","cat":"tanakh","q":"בחזון אחרית הימים של ישעיהו, מי גר עם הכבש?","options":["אריה","דוב","שועל","זאב"],"answer":3,"explain":"\"וגר זאב עם כבש ונמר עם גדי ירבץ ... ונער קטן נהג בם\". בעולם מצטטים הרבה \"אריה עם כבש\", אבל הצירוף הזה לא כתוב בפסוק. האריה מופיע בחזון אחר, בישעיהו סה: \"ואריה כבקר יאכל תבן\".","difficulty":1,"source":"https://www.sefaria.org/Isaiah.11.6?lang=he"},{"id":"tanakh-038","cat":"tanakh","q":"מאיזה ספר מגיע הביטוי \"אכול ושתו כי מחר נמות\"?","options":["קהלת","משלי","ישעיהו","שיר השירים"],"answer":2,"explain":"רוב האנשים בטוחים שזה קהלת, אבל המקור הוא ישעיהו כב. וזו בכלל לא עצה: הנביא מצטט כך את העם שמסרב לחזור בתשובה.","difficulty":3,"source":"https://www.sefaria.org/Isaiah.22.13?lang=he"},{"id":"tanakh-039","cat":"tanakh","q":"מה בלע את יונה, לפי ספר יונה?","options":["לווייתן","תנין","דג גדול","כריש"],"answer":2,"explain":"\"וימן יהוה דג גדול לבלע את יונה\", ויונה היה במעיו שלושה ימים ושלושה לילות. המילה \"לווייתן\" לא מופיעה בסיפור בכלל.","difficulty":1,"source":"https://www.sefaria.org/Jonah.2.1?lang=he"},{"id":"tanakh-040","cat":"tanakh","q":"בסוף ספר איוב הוא מקבל פי שניים מהרכוש שהיה לו. כמה שנים חי אחרי זה?","options":["140","70","120","1,000"],"answer":0,"explain":"הצאן הוכפל מ-7,000 ל-14,000, וגם הגמלים. הילדים לא הוכפלו: שוב 7 בנים ו-3 בנות. והפעם הבנות מקבלות שמות: ימימה, קציעה וקרן הפוך.","difficulty":3,"source":"https://www.sefaria.org/Job.42.16?lang=he"},{"id":"tanakh-041","cat":"tanakh","q":"מרדכי גידל את אסתר. מה הקשר המשפחתי ביניהם לפי המגילה?","options":["היא אחייניתו","היא אחותו הצעירה","היא נכדתו","היא בת דודו"],"answer":3,"explain":"\"את הדסה היא אסתר בת דדו\", כלומר יש לה גם שם נוסף, הדסה. מרדכי אימץ אותה: \"לקחה מרדכי לו לבת\".","difficulty":2,"source":"https://www.sefaria.org/Esther.2.7?lang=he"},{"id":"tanakh-042","cat":"tanakh","q":"המלך שואל את המן מה עושים \"לאיש אשר המלך חפץ ביקרו\". מה עובר להמן בראש?","options":["\"זה בטח מרדכי\"","\"למי יחפץ המלך... יותר ממני?\"","\"זה מבחן נאמנות\"","\"המלך מדבר על עצמו\""],"answer":1,"explain":"המן בטוח שמדובר בו, ומתכנן לעצמו לבוש מלכות וסוס. בסוף הוא זה שמוביל את מרדכי ברחובות וקורא לפניו \"ככה יעשה לאיש אשר המלך חפץ ביקרו\".","difficulty":1,"funny":true,"source":"https://www.sefaria.org/Esther.6.6?lang=he"},{"id":"tanakh-043","cat":"tanakh","q":"מאיפה מגיע השם \"פורים\", לפי מגילת אסתר?","options":["ממשתה המלך","מ\"פור\", כלומר גורל","ממילה פרסית שפירושה מסכה","מ\"פורענות\" שהתהפכה"],"answer":1,"explain":"המן \"הפיל פור הוא הגורל\" כדי לבחור את היום, והגורל נפל על חודש אדר. \"על כן קראו לימים האלה פורים על שם הפור\".","difficulty":1,"source":"https://www.sefaria.org/Esther.9.26?lang=he"},{"id":"tanakh-044","cat":"tanakh","q":"בבבל קיבלו דניאל וחבריו שמות חדשים. מה היה השם החדש של דניאל?","options":["בלשאצר","בלטשאצר","שדרך","עבד נגו"],"answer":1,"explain":"בלשאצר, עם אות אחת פחות, הוא בכלל המלך שראה על הקיר את \"מנא מנא תקל ופרסין\". שדרך ועבד נגו היו חבריו של דניאל, חנניה ועזריה, שהושלכו לכבשן האש.","difficulty":3,"source":"https://www.sefaria.org/Daniel.1.7?lang=he"},{"id":"tanakh-045","cat":"tanakh","q":"בכמה ימים השלימו אנשי נחמיה את בניית חומת ירושלים?","options":["52","40","7","70"],"answer":0,"explain":"החומה הושלמה ב-25 באלול. והבנאים עבדו בשיטה שכל מילואימניק מכיר: \"באחת ידו עשה במלאכה ואחת מחזקת השלח\" (נחמיה ד, יא).","difficulty":3,"source":"https://www.sefaria.org/Nehemiah.6.15?lang=he"},{"id":"world-001","cat":"world","q":"איזה מבין שבעת פלאי תבל של העולם העתיק הוא היחיד ששרד עד היום?","options":["הפירמידה הגדולה בגיזה","המגדלור באלכסנדריה","הקולוסוס מרודוס","הגנים התלויים בבבל"],"answer":0,"explain":"היא נבנתה בערך ב-2584–2561 לפנה\"ס. על הגנים התלויים בבבל אין אפילו הוכחה שהם היו קיימים בכלל.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Seven_Wonders_of_the_Ancient_World"},{"id":"world-002","cat":"world","q":"כשההמון הסתער על הבסטיליה ב-14 ביולי 1789, כמה אסירים ישבו בה?","options":["70","7","700","7,000"],"answer":1,"explain":"ארבעה זייפנים, שני אסירים שהוגדרו חולי נפש ורוזן שנכלא בצו מלכותי לבקשת אביו. ובכל זאת, 14 ביולי הוא עד היום היום הלאומי של צרפת.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Storming_of_the_Bastille"},{"id":"world-003","cat":"world","q":"כמה שנים נמשכה בפועל \"מלחמת מאה השנים\" בין אנגליה לצרפת?","options":["100","99","116","130"],"answer":2,"explain":"מ-1337 עד 1453, והיא הסתיימה בניצחון צרפתי. ז'אן ד'ארק הועלתה על המוקד באמצע הדרך, ב-1431.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Hundred_Years%27_War"},{"id":"world-004","cat":"world","q":"באיזה חודש, לפי הלוח הגרגוריאני שלנו, התרחשה \"מהפכת אוקטובר\" ברוסיה ב-1917?","options":["אוקטובר","ספטמבר","דצמבר","נובמבר"],"answer":3,"explain":"7 בנובמבר 1917. ברוסיה נהג אז הלוח היוליאני, ולפיו זה היה 25 באוקטובר. רוסיה עברה ללוח הגרגוריאני רק ב-1918.","difficulty":2,"source":"https://en.wikipedia.org/wiki/October_Revolution"},{"id":"world-005","cat":"world","q":"איזו אימפריה הייתה הגדולה בהיסטוריה בשטח?","options":["האימפריה הבריטית","האימפריה המונגולית","האימפריה הרומית","האימפריה העות'מאנית"],"answer":0,"explain":"בשיאה, ב-1920, השתרעה על כ-35.5 מיליון קמ\"ר. המונגולית במקום השני (כ-24 מיליון), והרומית הגיעה בשיאה רק לכ-5 מיליון.","difficulty":2,"source":"https://en.wikipedia.org/wiki/List_of_largest_empires"},{"id":"world-006","cat":"world","q":"איזו פסגה היא הנקודה הרחוקה ביותר ממרכז כדור הארץ?","options":["האוורסט","צ'ימבורסו באקוודור","אקונקגואה","דנאלי"],"answer":1,"explain":"כדור הארץ \"תפוח\" באזור קו המשווה, ולכן הפסגה האקוודורית מנצחת את האוורסט. ומהבסיס עד הפסגה? השיאן הוא מאונה קיאה בהוואי.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Extremes_on_Earth"},{"id":"world-007","cat":"world","q":"מפלי אנחל (Angel Falls) בוונצואלה, המפל הגבוה בעולם, קרויים על שם...","options":["מלאך מאגדה מקומית","מיסיונר ספרדי","הטייס האמריקני ג'ימי אנג'ל","כנסייה סמוכה"],"answer":2,"explain":"אנג'ל טס מעל המפלים ב-1933. גובהם: 979 מטר.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Angel_Falls"},{"id":"world-008","cat":"world","q":"לבוליביה אין מוצא לים, ובכל זאת יש לה חיל ים. איפה הוא פועל?","options":["באוקיינוס השקט","בים הקריבי","בתעלת פנמה","באגם טיטיקקה ובנהרות"],"answer":3,"explain":"בוליביה איבדה את החוף שלה לצ'ילה במלחמת האוקיינוס השקט (1879–1883), אבל שמרה על חיל ים של כ-5,000 איש.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Bolivian_Navy"},{"id":"world-009","cat":"world","q":"בירת קזחסטן החליפה שם ב-2019 ושוב ב-2022. איך היא נקראת היום?","options":["אסטנה","נור-סולטאן","אלמטי","אקמולה"],"answer":0,"explain":"אסטנה הפכה לנור-סולטאן ב-2019 וחזרה לשמה ב-2022. כשהבירה עברה לשם מאלמטי, בדצמבר 1997, העיר עוד נקראה אקמולה, ושמה הוחלף לאסטנה ב-1998.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Astana"},{"id":"world-010","cat":"world","q":"לאיזו מדינה יש הדגל הלאומי היחיד בעולם שאינו מרובע?","options":["שווייץ","נפאל","בהוטן","קטאר"],"answer":1,"explain":"שני משולשים זה על זה, עם ירח ושמש. בצורתו הנוכחית הוא אומץ ב-1962. דגל שווייץ ריבועי, אבל עדיין מרובע.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Flag_of_Nepal"},{"id":"world-011","cat":"world","q":"המלחמה הקצרה בהיסטוריה: בריטניה נגד זנזיבר, 1896. כמה זמן היא נמשכה?","options":["6 שעות","3 ימים","38 עד 45 דקות","שבוע"],"answer":2,"explain":"בריטניה הציבה אולטימטום, הפגיזה, וזנזיבר נכנעה. המקורות חלוקים רק על הרגע המדויק שבו המלחמה התחילה ונגמרה, ומכאן הטווח.","difficulty":1,"funny":true,"source":"https://en.wikipedia.org/wiki/Anglo-Zanzibar_War"},{"id":"world-012","cat":"world","q":"ב-1932 שלח צבא אוסטרליה חיילים עם מקלעים ו-10,000 כדורים, ובסוף נסוג. נגד מי הוא נלחם?","options":["קנגורו","ארנבות","דינגו","עופות אמו"],"answer":3,"explain":"כ-20,000 אמו הרסו שדות חיטה. הציפורים התפזרו לקבוצות קטנות, הצבא נסוג, והמפקד, מייג'ור מרדית', הסביר שיש להן \"חסינות של טנק\".","difficulty":1,"funny":true,"source":"https://en.wikipedia.org/wiki/Emu_War"},{"id":"world-013","cat":"world","q":"ב-897 העמיד האפיפיור סטפנוס השישי למשפט נאשם יוצא דופן. את מי?","options":["את גופת קודמו, פורמוסוס","חמור שנכנס לכנסייה","קיסר ביזנטי","פסל של אל רומי"],"answer":0,"explain":"הגופה הוצאה מהקבר כתשעה חודשים אחרי המוות והושבה על כיסא. היא הורשעה, נקצצו לה שלוש אצבעות והיא הושלכה לטיבר, וכעבור כמה חודשים סטפנוס עצמו הודח.","difficulty":2,"funny":true,"source":"https://en.wikipedia.org/wiki/Cadaver_Synod"},{"id":"world-014","cat":"world","q":"ראש ממשלת אוסטרליה הרולד הולט נעלם ב-1967 כששחה בים, וגופתו לא נמצאה. מה נקרא על שמו במלבורן?","options":["ספרייה עירונית","בריכת שחייה ציבורית","שדה תעופה","גשר"],"answer":1,"explain":"\"מרכז השחייה לזכר הרולד הולט\" נפתח במרץ 1969. הבריכה הייתה בבנייה כשנעלם, והמועצה המקומית החליטה לקרוא לה על שמו.","difficulty":2,"funny":true,"source":"https://en.wikipedia.org/wiki/Disappearance_of_Harold_Holt"},{"id":"world-015","cat":"world","q":"שלושה מהסיפורים האלה אמיתיים לגמרי. איזה מהם הוא מיתוס?","options":["רוכב ניצח במרוץ סוסים כשהוא מת","דיילת שרדה את הטיטאניק ושתי אחיותיה","קליגולה מינה את סוסו לקונסול","נוכל מכר את מגדל אייפל לסוחר גרוטאות"],"answer":2,"explain":"המקורות העתיקים מספרים רק שקליגולה תכנן למנות את הסוס אינקיטטוס, ויש היסטוריונים שחושדים שגם זה הגזמה. הרוכב פרנק הייז (1923), הדיילת ויולט ג'סופ והנוכל ויקטור לוסטיג (1925) אמיתיים לגמרי.","difficulty":2,"funny":true,"source":"https://en.wikipedia.org/wiki/Incitatus"},{"id":"world-016","cat":"world","q":"באיסלנד הותר היין ב-1922 והמשקאות החריפים ב-1935, אבל משקה אחד חיכה בתור עד 1989. איזה?","options":["ויסקי","וודקה","ליקר","בירה"],"answer":3,"explain":"את היין התירו כי ספרד סירבה לקנות דגים מאיסלנד אם לא תקנה ממנה יין. 1 במרץ, היום שבו הבירה הותרה, נחגג שם מדי שנה כ\"יום הבירה\".","difficulty":2,"funny":true,"source":"https://en.wikipedia.org/wiki/Prohibition_in_Iceland"},{"id":"world-017","cat":"world","q":"ב-3 בספטמבר 1967 בחמש בבוקר עברה מדינה שלמה מנהיגה בצד שמאל לנהיגה בצד ימין. איזו?","options":["שוודיה","בריטניה","יפן","אירלנד"],"answer":0,"explain":"\"יום H\" יצא לפועל אף שבמשאל עם ב-1955 הצביעו 83% מהשוודים נגד השינוי.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Dagen_H"},{"id":"world-018","cat":"world","q":"מי הציע את השם \"פלוטו\" לכוכב הלכת שהתגלה ב-1930?","options":["קלייד טומבו, המגלה","ונישה ברני, תלמידה בת 11","האיגוד האסטרונומי הבין-לאומי","וולט דיסני"],"answer":1,"explain":"ונישה ברני מאוקספורד הציעה את השם לסבא שלה, והוא העביר אותו לאסטרונומים. ב-2006 החליט האיגוד האסטרונומי הבין-לאומי לסווג את פלוטו מחדש ככוכב לכת ננסי.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Pluto"},{"id":"world-019","cat":"world","q":"נינטנדו נוסדה ב-1889 בקיוטו. מה היא ייצרה בהתחלה?","options":["צעצועי עץ","מחשבונים","קלפי משחק בעבודת יד","אופניים"],"answer":2,"explain":"קלפי הנאפודה היפניים. למשחקים אלקטרוניים החברה נכנסה רק בשנות ה-70.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Nintendo"},{"id":"world-020","cat":"world","q":"איזו מההמצאות הבאות נרשמה כפטנט ראשונה?","options":["הטלפון","הפטיפון","הרדיו","מכשיר דמוי פקס"],"answer":3,"explain":"הסקוטי אלכסנדר ביין רשם פטנט ב-1843, 33 שנה לפני הטלפון (1876). שירות פקס מסחרי פעל בין פריז לליון כבר ב-1865.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Fax"},{"id":"world-021","cat":"world","q":"כמה מדליות אולימפיות יש למייקל פלפס, הספורטאי המעוטר בתולדות האולימפיאדה?","options":["28","18","22","35"],"answer":0,"explain":"23 מהן זהב. בבייג'ינג 2008 לבדה הוא זכה ב-8 מדליות זהב.","difficulty":1,"source":"https://en.wikipedia.org/wiki/List_of_multiple_Olympic_medalists"},{"id":"world-022","cat":"world","q":"מי זכתה בגביע העולם בכדורגל 2026, הראשון עם 48 נבחרות?","options":["ארגנטינה","ספרד","צרפת","ברזיל"],"answer":1,"explain":"1:0 על ארגנטינה בהארכה, משער של פראן טורס, באצטדיון מטלייף בניו ג'רזי. זה התואר השני של ספרד, אחרי 2010.","difficulty":1,"source":"https://inside.fifa.com/news/spain-crowned-world-cup-2026-champions-new-york-new-jersey"},{"id":"world-023","cat":"world","q":"ב-14 במאי 1948 הכירה מעצמה בישראל 11 דקות בלבד אחרי ההכרזה. איזו?","options":["ברית המועצות","בריטניה","ארצות הברית","צרפת"],"answer":2,"explain":"הנשיא הארי טרומן נתן הכרה דה-פקטו. את ההכרה המלאה (דה-יורה) הראשונה נתנה דווקא ברית המועצות, ב-17 במאי.","difficulty":1,"source":"https://www.trumanlibrary.gov/education/presidential-inquiries/recognition-israel"},{"id":"world-024","cat":"world","q":"איזו מדינה הייתה הראשונה עם רוב מוסלמי שהכירה בישראל, במרץ 1949?","options":["איראן","מצרים","ירדן","טורקיה"],"answer":3,"explain":"זה קרה אף שטורקיה הצביעה נגד תוכנית החלוקה ב-1947. המדינה הערבית הראשונה שהכירה בישראל הייתה מצרים, רק עם הסכם השלום ב-1979.","difficulty" "הקהילה הגדולה ביותר מחוץ לישראל היא בארצות הברית. באמריקה הלטינית הגדולה היא בארגנטינה, ובאפריקה בדרום אפריקה.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Jewish_population_by_country"},{"id":"zion-001","cat":"zionism","q":"מי כתב את \"רומי וירושלים\" (1862), שקרא לשיבה לארץ ישראל ולהקמת חברה סוציאליסטית בה?","options":["ליאו פינסקר","נתן בירנבאום","אחד העם","משה הס"],"answer":3,"explain":"הספר נכתב על רקע איחוד איטליה. הס ראה בשחרור \"העיר הנצחית שעל הטיבר\" סימן לכך שגם \"העיר הנצחית שעל הר המוריה\" תשתחרר.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Rome_and_Jerusalem"},{"id":"zion-002","cat":"zionism","q":"ליאו פינסקר, רופא מאודסה, פרסם ב-1882 חיבור שקרא ליהודים לא לחכות לשוויון זכויות אלא לשחרר את עצמם. איך נקרא?","options":["\"אוטואמנציפציה\"","\"מדינת היהודים\"","\"דרישת ציון\"","\"לא זה הדרך\""],"answer":0,"explain":"השם פירושו \"שחרור עצמי\". שנתיים אחר כך עמד פינסקר בראש ועידת קטוביץ (1884), שאיחדה את אגודות \"חובבי ציון\".","difficulty":1,"source":"https://www.encyclopedia.com/religion/encyclopedias-almanacs-transcripts-and-maps/zionism"},{"id":"zion-003","cat":"zionism","q":"השם \"ביל\"ו\", של הסטודנטים שעלו לארץ ב-1882, הוא ראשי תיבות. של מה?","options":["\"בני ישראל לארץ ושבו\"","\"בית יעקב לכו ונלכה\"","\"בואו ילדים לציון ונבנה\"","שמות ארבעת המייסדים"],"answer":1,"explain":"זה פסוק מישעיהו ב', ה'. בהתחלה נקראה התנועה \"דביו\", על פי פסוק משמות, והשם שונה ביוזמת ישראל בלקינד. אנשי ביל\"ו ייסדו לבסוף את גדרה (1884).","difficulty":1,"source":"https://en.wikipedia.org/wiki/Bilu_(movement)"},{"id":"zion-004","cat":"zionism","q":"מי טבע ב-1890 את המונח \"ציונות\"?","options":["נתן בירנבאום","בנימין זאב הרצל","ליאו פינסקר","אחד העם"],"answer":0,"explain":"המונח הופיע בכתב העת \"Selbst-Emancipation\", שש שנים לפני ש\"מדינת היהודים\" של הרצל יצא לאור. המילה הייתה קיימת לפני האיש שהכי מזוהה איתה.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Timeline_of_Zionism"},{"id":"zion-005","cat":"zionism","q":"איך נקראה השכונה הראשונה שנבנתה מחוץ לחומות העיר העתיקה בירושלים, ב-1860 עד 1861?","options":["נחלת שבעה","מאה שערים","רחביה","משכנות שאננים"],"answer":3,"explain":"השכונה נבנתה ביוזמת משה מונטיפיורי. במילים אחרות, הסיפור של ירושלים החדשה מתחיל בה.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Timeline_of_Zionism"},{"id":"zion-006","cat":"zionism","q":"באיזו שנה פרסם הרצל את \"מדינת היהודים\" (Der Judenstaat)?","options":["1882","1897","1896","1902"],"answer":2,"explain":"פרשת דרייפוס (1894), שהרצל סיקר כעיתונאי, נחשבת לזרז מרכזי. שנה אחרי הספר הוא כבר כינס את הקונגרס הציוני הראשון.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Timeline_of_Zionism"},{"id":"zion-007","cat":"zionism","q":"הקונגרס הציוני הראשון תוכנן להתקיים במינכן. למה הוא עבר בסוף לבזל?","options":["האולם במינכן הוזמן לחתונה","יהודי מינכן לא רצו אותו","בשוויץ היה קל יותר לקבל אשרות","הרצל נרדם ברכבת ופספס תחנה"],"answer":1,"explain":"ההתנגדות באה מהקהילה היהודית של מינכן, גם מאורתודוקסים וגם מרפורמים.","difficulty":2,"funny":true,"source":"https://en.wikipedia.org/wiki/First_Zionist_Congress"},{"id":"zion-008","cat":"zionism","q":"אחרי הקונגרס הראשון כתב הרצל ביומנו: \"בבזל יסדתי את מדינת היהודים\". בעוד כמה שנים, לדבריו, \"בוודאי\" יכירו בכך הכול?","options":["10","20","50","100"],"answer":2,"explain":"הוא הוסיף שאם יאמר זאת בקול היום, יענו לו בצחוק, ואולי יכירו בכך בעוד חמש שנים. המדינה הוכרזה 50 שנה ושמונה חודשים אחרי שכתב את הדברים.","difficulty":1,"source":"https://en.wikipedia.org/wiki/First_Zionist_Congress"},{"id":"zion-009","cat":"zionism","q":"\"תוכנית בזל\" (1897): \"הציונות שואפת להקים לעם היהודי בית בארץ ישראל המובטח ___\". מה חסר?","options":["במשפט הבינלאומי","בהסכמת הסולטאן","בכוח הזרוע","במשפט הציבורי"],"answer":3,"explain":"ליאו מוצקין דרש \"במשפט הבינלאומי\", והרצל הציע את נוסח הפשרה. את התוכנית ניסחה ועדה בראשות מקס נורדאו.","difficulty":2,"source":"https://en.wikipedia.org/wiki/First_Zionist_Congress"},{"id":"zion-010","cat":"zionism","q":"מי הציע להרצל את \"תוכנית אוגנדה\"?","options":["הנציב העליון הרברט סמואל","דייוויד לויד ג'ורג'","וינסטון צ'רצ'יל","שר המושבות הבריטי ג'וזף צ'מברלין"],"answer":3,"explain":"ועוד פרט: השטח שהוצע, אזור אואסין גישו, נמצא בכלל בקניה של היום, לא באוגנדה.","difficulty":3,"source":"https://en.wikipedia.org/wiki/British_Uganda_Programme"},{"id":"zion-011","cat":"zionism","q":"בדגל שהציע הרצל ב\"מדינת היהודים\" היו שבעה כוכבי זהב על רקע לבן. מה סימלו הכוכבים?","options":["שבעת ימי הבריאה","שבעת קני המנורה","יום עבודה של שבע שעות","שבעת המינים"],"answer":2,"explain":"הכוכבים ייצגו את יום העבודה של שבע שעות שהרצל ראה בחזונו. בסוף ניצח הדגל שמבוסס על הטלית: לבן, תכלת ומגן דוד.","difficulty":2,"funny":true,"source":"https://en.wikipedia.org/wiki/Flag_of_Israel"},{"id":"zion-012","cat":"zionism","q":"אנשי איזו עלייה הקימו את ההסתדרות הכללית של העובדים ב-1920, והשתתפו בהקמת ההגנה?","options":["העלייה הראשונה","העלייה השלישית","העלייה השנייה","העלייה הרביעית"],"answer":1,"explain":"העלייה השלישית (1919 עד 1923) באה בעקבות המהפכה הבולשביקית, הפוגרומים באוקראינה והצהרת בלפור. רבים מאנשיה היו בוגרי \"החלוץ\" ו\"השומר הצעיר\".","difficulty":2,"source":"https://archive.jewishagency.org/historical-aliyah/content/28841/"},{"id":"zion-013","cat":"zionism","q":"איזו עלייה כונתה \"עליית גרבסקי\", על שם שר האוצר הפולני?","options":["העלייה הרביעית","העלייה השלישית","העלייה החמישית","העלייה השנייה"],"answer":0,"explain":"מדיניות המיסוי של גרבסקי פגעה בסוחרים היהודים בפולין. העולים היו בעיקר בני מעמד הביניים, חנוונים ובעלי מלאכה, ורובם התיישבו בערים, במיוחד בתל אביב.","difficulty":2,"source":"https://www.jewishvirtuallibrary.org/the-fourth-aliyah-1924-1929"},{"id":"zion-014","cat":"zionism","q":"איזו מהעליות הממוספרות, מהראשונה עד החמישית, הייתה הגדולה ביותר?","options":["העלייה הראשונה","העלייה השנייה","העלייה החמישית","העלייה השלישית"],"answer":2,"explain":"כ-250,000 עולים, יותר מרבע מהם מגרמניה ומאוסטריה, בעיקר אחרי עליית הנאצים לשלטון ב-1933. רבים היו רופאים ואקדמאים, והם היו גרעין התזמורת הפילהרמונית.","difficulty":1,"source":"https://archive.jewishagency.org/historical-aliyah/content/28841/"},{"id":"zion-015","cat":"zionism","q":"איזה יישוב ליד הכנרת היה הקבוצה (הקבוצה השיתופית) הראשונה?","options":["עין חרוד","מרחביה","דגניה","כנרת"],"answer":2,"explain":"ראשיתה ב-1909, והקבוצה נוסדה רשמית ב-1910. השם נגזר מ\"דגן\". א\"ד גורדון, המשוררת רחל ויוסף טרומפלדור חיו בה, ומשה דיין היה הילד השני שנולד בה.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Degania_Alef"},{"id":"zion-016","cat":"zionism","q":"מ-1946 גירשו הבריטים עשרות אלפי מעפילים שתפסו למחנות מעצר מחוץ לארץ. איפה היו המחנות?","options":["בקפריסין","במלטה","בכרתים","ברודוס"],"answer":0,"explain":"כ-51,000 מעפילים נכלאו בקפריסין. בסך הכול הגיעו לארץ בעליית ב' (1934–1948) כ-115,000 מעפילים, ובשנים 1945 עד 1948 יצאו לדרך 65 ספינות. רובן נתפסו.","difficulty":1,"source":"https://archive.jewishagency.org/historical-aliyah/content/28841/"},{"id":"zion-017","cat":"zionism","q":"1947: הבריטים משתלטים על אוניית המעפילים \"אקסודוס\". לאן הובלו מעפיליה בסוף, והורדו מהאוניות בכוח?","options":["לקפריסין","למאוריציוס","לעתלית","להמבורג שבגרמניה"],"answer":3,"explain":"קודם הם הוחזרו לצרפת, אבל צרפת הסכימה להוריד אותם רק מרצונם. בהמבורג, בספטמבר 1947, הורדו הגברים בכוח. חברי ועדת אונסקו\"פ של האו\"ם ראו בחיפה את העברתם לאוניות הגירוש.","difficulty":2,"source":"https://en.wikipedia.org/wiki/SS_Exodus"},{"id":"zion-018","cat":"zionism","q":"מי נחשב לאבי \"הציונות הרוחנית\", שראתה בארץ ישראל \"מרכז רוחני\" לעם היהודי?","options":["אחד העם","בנימין זאב הרצל","זאב ז'בוטינסקי","א\"ד גורדון"],"answer":0,"explain":"\"אחד העם\" הוא שם העט של אשר צבי גינצברג, ופירושו \"אחד מן העם\". הוא ראה בציונות המדינית של הרצל תוכנית לא מעשית, ושאף ל\"מדינה יהודית, ולא רק מדינה של יהודים\".","difficulty":1,"source":"https://en.wikipedia.org/wiki/Ahad_Ha%27am"},{"id":"zion-019","cat":"zionism","q":"תל אביב רצתה מאוד שאחד העם יגור בה. מה עשתה כדי לשכנע אותו?","options":["הבטיחה לו חנייה קבועה בדיזנגוף","פטרה אותו מארנונה לכל החיים","הציעה לו שולחן קבוע בקפה","קראה רחוב על שמו"],"answer":3,"explain":"הרחוב נקרא על שמו, והוא קיבל בו את הבית מספר 1.","difficulty":2,"funny":true,"source":"https://en.wikipedia.org/wiki/Ahad_Ha%27am"},{"id":"zion-020","cat":"zionism","q":"במלחמת העולם הראשונה פיתח הכימאי חיים ויצמן תהליך תסיסה לייצור חומר שהבריטים היו זקוקים לו. איזה?","options":["פניצילין, לטיפול בפצועים","גומי, לצמיגים","דלק למטוסים","אצטון, לייצור חומרי נפץ"],"answer":3,"explain":"בתהליך יוצרו במלחמה כ-30,000 טון אצטון. ויצמן היה אז מרצה לכימיה במנצ'סטר, ובהמשך היה מהפעילים המרכזיים בהשגת הצהרת בלפור.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Chaim_Weizmann"},{"id":"zion-021","cat":"zionism","q":"ז'בוטינסקי בחר בשם העט \"אלטלנה\" כי חשב שזו \"מעלית\" באיטלקית. מה זה באמת?","options":["מגדלור","נדנדה","פסטה ברוטב שמנת","זו באמת מעלית, הוא צדק"],"answer":1,"explain":"כשהתברר לו הפירוש, החליט ז'בוטינסקי שהשם דווקא מתאים לו, כי הוא \"בשום אופן לא יציב\", אלא מתנדנד.","difficulty":2,"funny":true,"source":"https://en.wikipedia.org/wiki/Ze%27ev_Jabotinsky"},{"id":"zion-022","cat":"zionism","q":"דצמבר 1918, הגדודים העבריים. החייל דוד בן-גוריון נעדר חמישה ימים בלי רשות. מה קרה לו?","options":["נשלח לחודש בכלא צבאי","קיבל נזיפה בכתב","הורד בדרגה מרב\"ט לטוראי","מונה לראש ממשלה"],"answer":2,"explain":"בן-גוריון ויצחק בן-צבי שירתו שניהם כחיילים בגדודים העבריים בצבא הבריטי, ושם נרשם ראש הממשלה הראשון של ישראל כנפקד.","difficulty":2,"funny":true,"source":"https://en.wikipedia.org/wiki/David_Ben-Gurion"},{"id":"zion-023","cat":"zionism","q":"ב-1925 ייסד ברל כצנלסון, עם משה ביילינסון, עיתון, והיה עורכו הראשון. איזה עיתון?","options":["\"הארץ\"","\"הצופה\"","\"על המשמר\"","\"דבר\""],"answer":3,"explain":"כצנלסון, מאבות ציונות העבודה, היה גם ממייסדי ההסתדרות (1920), וייסד את הוצאת הספרים \"עם עובד\".","difficulty":2,"source":"https://en.wikipedia.org/wiki/Berl_Katznelson"},{"id":"zion-024","cat":"zionism","q":"מי היה הרב הראשי האשכנזי הראשון של ארץ ישראל המנדטורית, מ-1921?","options":["הרב יצחק ריינס","הרב אברהם יצחק הכהן קוק","הרב שמואל מוהליבר","הרב יהודה אלקלעי"],"answer":1,"explain":"בניגוד לרבנים אורתודוקסים רבים, הרב קוק ראה בחלוצים החילונים חלק מתהליך הגאולה. הוא ייסד בירושלים את ישיבת \"מרכז הרב\", וכיהן בתפקיד עד מותו ב-1935.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Abraham_Isaac_Kook"},{"id":"zion-025","cat":"zionism","q":"הנרייטה סאלד, ילידת בולטימור, הייתה ב-1912 ממייסדות ארגון הנשים הציוניות של אמריקה. איך הוא נקרא?","options":["הדסה","ויצו","נעמת","אמונה"],"answer":0,"explain":"סאלד עמדה גם בין מובילי \"עליית הנוער\", שהחלה ב-1933 והצילה כ-30,000 ילדים יהודים מאירופה הנאצית.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Henrietta_Szold"},{"id":"zion-026","cat":"zionism","q":"מי נחשב לדובר העברית הילידי הראשון בעת החדשה?","options":["אליעזר בן-יהודה","חיים נחמן ביאליק","איתמר בן-אב\"י, בנו של בן-יהודה","יוסף טרומפלדור"],"answer":2,"explain":"מלכודת נפוצה: לא בן-יהודה עצמו, אלא הבן, שנולד בשם בן-ציון וגודל בעברית בלבד. בן-יהודה הרחיק אותו משפות אחרות, ואפילו נזף באשתו כששרה לו שיר ערש ברוסית.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Eliezer_Ben-Yehuda"},{"id":"zion-027","cat":"zionism","q":"\"מלחמת השפות\", 1913: הנהלת ה\"טכניקום\" בחיפה החליטה ללמד בשפה שאינה עברית, ופרצה מחאה. באיזו שפה?","options":["יידיש","גרמנית","צרפתית","אנגלית"],"answer":1,"explain":"המוסד מומן בידי חברת \"עזרה\" של יהודי גרמניה. אחרי מחאה של מורים ותלמידים ברחבי היישוב הוכרע, בפברואר 1914, שהלימודים בו יהיו בעברית. היום זה הטכניון.","difficulty":1,"source":"https://en.wikipedia.org/wiki/War_of_the_Languages"},{"id":"zion-028","cat":"zionism","q":"באיזו שנה נפתחה האוניברסיטה העברית בהר הצופים?","options":["1912","1918","1948","1925"],"answer":3,"explain":"אבן הפינה הונחה כבר ב-24 ביולי 1918, והפתיחה הייתה ב-1 באפריל 1925. אלברט איינשטיין היה ממייסדיה, והוריש לה את כתביו ואת זכויות היוצרים עליהם.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Hebrew_University_of_Jerusalem"},{"id":"zion-029","cat":"zionism","q":"איזה עיתון ערך אליעזר בן-יהודה בירושלים?","options":["\"הַמֵּלִיץ\"","\"הצבי\"","\"השילוח\"","\"הארץ\""],"answer":1,"explain":"אחרי התנגדות חרדית נסגר העיתון לשנה, ב-1908 שינה את שמו ל\"האור\", ובמלחמת העולם הראשונה נסגר. בן-יהודה היה גם ממייסדי \"ועד הלשון\", שהפך לימים לאקדמיה ללשון העברית.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Eliezer_Ben-Yehuda"},{"id":"zion-030","cat":"zionism","q":"באיזו שנה נוסדה הקרן הקיימת לישראל (קק\"ל)?","options":["1897","1901","1909","1920"],"answer":1,"explain":"היא נוסדה בקונגרס הציוני החמישי, בבזל. את הרעיון הציע כבר בקונגרס הראשון צבי הרמן שפירא, פרופסור למתמטיקה.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Jewish_National_Fund"},{"id":"zion-031","cat":"zionism","q":"ארגון \"בר גיורא\" נוסד ב-1907 ביפו, בחדרו של מנהיג ציוני לעתיד. של מי?","options":["דוד בן-גוריון","זאב ז'בוטינסקי","יוסף טרומפלדור","יצחק בן-צבי"],"answer":3,"explain":"בין המייסדים היו ישראל שוחט, אלכסנדר זייד ויחזקאל חנקין. ב-1909 קם ממשיכו, \"השומר\", שפעל עד 1920, אז קמה ההגנה.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Itzhak_Ben-Zvi"},{"id":"zion-032","cat":"zionism","q":"רשת הריגול ניל\"י, שפעלה למען הבריטים נגד העות'מאנים, נחשפה בסתיו 1917. מה הוביל לחשיפה?","options":["מכתב שיורט בדואר","יונת דואר של הרשת שנתפסה","מפה שנמצאה אצל טייס בריטי","שידור רדיו שאותר"],"answer":1,"explain":"השם ניל\"י הוא ראשי תיבות של \"נצח ישראל לא ישקר\" (שמואל א', ט\"ו, כ\"ט). מרכז הרשת היה בזכרון יעקב, ובראשה עמדו בני משפחת אהרונסון ואבשלום פיינברג.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Nili"},{"id":"zion-033","cat":"zionism","q":"\"גדוד נהגי הפרדות\" (1915), שסגן מפקדו היה יוסף טרומפלדור, הוביל אספקה לחזית. לאיזו?","options":["סיני","גליפולי","צרפת","ארץ ישראל"],"answer":1,"explain":"מפקד הגדוד היה הקצין הבריטי ג'ון הנרי פטרסון, שפיקד אחר כך גם על אחד הגדודים העבריים. לפני השריון והאוויר, היו הפרדות.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Jewish_Legion"},{"id":"zion-034","cat":"zionism","q":"מי ייסד ב-1940 את הלח\"י, אחרי שפרש מהאצ\"ל?","options":["מנחם בגין","יצחק שמיר","אברהם שטרן","דוד רזיאל"],"answer":2,"explain":"הבריטים כינו את הארגון \"כנופיית שטרן\". שטרן נורה למוות ב-1942, אחרי שנעצר, בנסיבות שנויות במחלוקת.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Lehi_(militant_group)"},{"id":"zion-035","cat":"zionism","q":"מי היה המפקד הראשון של הפלמ\"ח, שהוקם ב-1941?","options":["יגאל אלון","משה דיין","יצחק שדה","יעקב דורי"],"answer":2,"explain":"הפלמ\"ח הוקם בידי מפקדת ההגנה, מחשש לפלישה של מדינות הציר. אנשיו ישבו בקיבוצים: בכל חודש 14 ימי עבודה, 8 ימי אימונים ו-7 ימי מנוחה. יגאל אלון היה המפקד השני.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Palmach"},{"id":"zion-036","cat":"zionism","q":"\"ליל הגשרים\", יוני 1946: הפלמ\"ח יצא לפוצץ את 11 הגשרים שחיברו את הארץ לשכנותיה. כמה מהם פוצצו?","options":["10","11","6","3"],"answer":0,"explain":"בפעולה בגשר א-זיב נהרגו 14 לוחמים.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Palmach"},{"id":"zion-037","cat":"zionism","q":"איזה היה יישוב \"חומה ומגדל\" הראשון, שהוקם ב-10 בדצמבר 1936?","options":["חניתה","עין גב","תל עמל (היום ניר דוד)","כפר גלעדי"],"answer":2,"explain":"את השיטה הגה שלמה גור, ממייסדי תל עמל. עד 1939 הוקמו כך עשרות יישובים, כל אחד ביום אחד.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Tower_and_stockade"},{"id":"zion-038","cat":"zionism","q":"הצהרת בלפור (2 בנובמבר 1917) הייתה בעצם מכתב. למי הוא נשלח?","options":["הלורד וולטר רוטשילד","חיים ויצמן","הברון אדמונד דה רוטשילד","בנימין זאב הרצל"],"answer":0,"explain":"המכתב נשלח להעברה לפדרציה הציונית של בריטניה. הנוסח הוא משפט אחד בן 67 מילים באנגלית, והמקור שמור היום בספרייה הבריטית בלונדון.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Balfour_Declaration"},{"id":"zion-039","cat":"zionism","q":"איזו ועדה הציעה לראשונה, ב-1937, לחלק את הארץ למדינה יהודית ולמדינה ערבית?","options":["ועדת פיל","ועדת וודהד","ועדת אונסקו\"פ","ועדת שו"],"answer":0,"explain":"הוועדה המלכותית בראשות הלורד ויליאם פיל הציעה למדינה היהודית כ-20% מהשטח, כולל רוב החוף, עמק יזרעאל וחלק גדול מהגליל. ירושלים ופרוזדור ליפו היו אמורים להישאר בידי בריטניה.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Peel_Commission"},{"id":"zion-040","cat":"zionism","q":"הספר הלבן של מאי 1939 הגביל את העלייה בחמש השנים הבאות. לכמה עולים בסך הכול?","options":["7,500","75,000","750,000","1,000,000"],"answer":1,"explain":"10,000 בשנה ועוד 25,000 פליטים, ואחר כך עלייה רק בהסכמת הערבים. בן-גוריון הגיב: נעזור לצבא הבריטי כאילו אין ספר לבן, ונילחם בספר הלבן כאילו אין מלחמה.","difficulty":2,"source":"https://en.wikipedia.org/wiki/White_Paper_of_1939"},{"id":"zion-041","cat":"zionism","q":"14.5.1948: זאב שרף, מזכיר מנהלת העם, צריך להגיע להכרזת המדינה, ואין לו רכב. איך זה נגמר?","options":["הזמין מונית והגיע שעה לפני","ההכרזה נדחתה ביום בגללו","טרמפ עם נהג בלי רישיון, הגיע ב-15:59","רכב על פרדה של הגדוד העברי"],"answer":2,"explain":"בדרך הם נעצרו על מהירות מופרזת, והשוטר ויתר על הדוח.","difficulty":2,"funny":true,"source":"https://en.wikipedia.org/wiki/Israeli_Declaration_of_Independence"},{"id":"zion-042","cat":"zionism","q":"מה מהבאים הושמט ממגילת העצמאות בכוונה, אחרי הצבעה של 5 נגד 4?","options":["גבולות המדינה","השם \"מדינת ישראל\"","אזכור הצהרת בלפור","קריאה לשלום למדינות השכנות"],"answer":0,"explain":"בן-גוריון טען שאין לכבול את המדינה לגבולות שהערבים לא קיבלו.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Israeli_Declaration_of_Independence"},{"id":"zion-043","cat":"zionism","q":"מי היה החותם הצעיר ביותר על מגילת העצמאות, בן 29, וגם האחרון מבין החותמים שנפטר?","options":["משה שרת","יצחק בן-צבי","גולדה מאיר","מאיר וילנר"],"answer":3,"explain":"וילנר, מהמפלגה הקומוניסטית, נפטר ב-2003. המבוגר בחותמים היה בן 82.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Israeli_Declaration_of_Independence"},{"id":"zion-044","cat":"zionism","q":"מי כתב את מילות \"התקווה\"?","options":["נפתלי הרץ אימבר","חיים נחמן ביאליק","שאול טשרניחובסקי","נחום סוקולוב"],"answer":0,"explain":"השם המקורי של השיר היה \"תקוותנו\". את הלחן התאים שמואל כהן, נער מראשון לציון, ו\"התקווה\" הפכה להמנון הרשמי בחוק רק ב-2004.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Hatikvah"},{"id":"zion-045","cat":"zionism","q":"דגל לבן-כחול עם מגן דוד נישא כבר ב-1885, 12 שנה לפני הקונגרס הציוני הראשון. באיזו מושבה?","options":["ראשון לציון","זכרון יעקב","פתח תקווה","ראש פינה"],"answer":0,"explain":"הוא נישא בתהלוכה לציון שלוש שנים למושבה, ועיצבו אותו ישראל בלקינד, מראשי ביל\"ו, ופאני אברמוביץ'.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Flag_of_Israel"}];
const BY_ID = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));

const CATS = { history: "היסטוריה", geography: "גיאוגרפיה", tanakh: "תנ״ך", leaders: "נשיאים וראשי ממשלה", zionism: "ציונות", world: "העולם" };
const LEVELS = { 1: "קלות", 2: "בינוניות", 3: "קשות" };
const DIFF = { 1: "קלה", 2: "בינונית", 3: "קשה" };
const RIGHT = ["נכון.", "נכון מאוד.", "בדיוק.", "יפה.", "צדקת."];
const WRONG = ["לא נכון.", "לא הפעם.", "טעות.", "פספוס."];

// ---------- progress, saved on this phone ----------
const STORE_KEY = "yediat-haaretz-v1";
function loadStore() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; s.q = s.q || {}; s.saved = s.saved || {}; return s; }
  catch (e) { return { q: {}, saved: {} }; }
}
function saveStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }
let store = loadStore();
const stat = (id) => store.q[id] || { seen: 0, right: 0 };

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id)); }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2400); }

// a "mode" is the set of questions you play through, start to finish
const MODES = {
  all:  { pool: () => QUESTIONS },
  fun:  { pool: () => QUESTIONS.filter(q => q.funny || q.joke) },
  hard: { pool: () => QUESTIONS.filter(q => q.difficulty === 3 && !q.joke) },
};
function poolFor(key) {
  if (MODES[key]) return MODES[key].pool();
  if (key.startsWith("lvl")) { const d = Number(key.slice(3)); return QUESTIONS.filter(q => (q.difficulty || 2) === d && !q.joke); }
  if (key.startsWith("cat:")) { const c = key.slice(4); return QUESTIONS.filter(q => q.cat === c); }
  return [];
}
// a saved game still in progress for this mode, if any
function savedGame(key) {
  const s = store.saved[key];
  if (!s) return null;
  const ids = s.ids.filter(id => BY_ID[id]);
  if (!ids.length || s.i >= ids.length || s.i === 0) return null;
  return { ...s, ids };
}

// ---------- playing ----------
let game = null;

function start(key, fresh) {
  closeSheet();
  const saved = fresh ? null : savedGame(key);
  if (saved) game = { key, ids: saved.ids, i: saved.i, score: saved.score, scored: saved.scored, picks: saved.picks || {} };
  else {
    const ids = shuffle(poolFor(key)).map(q => q.id);
    if (!ids.length) { toast("אין כאן שאלות עדיין."); return; }
    game = { key, ids, i: 0, score: 0, scored: 0, picks: {} };
  }
  game.answered = false;
  show("quiz");
  renderQuestion();
}

function persist() {
  store.saved[game.key] = { ids: game.ids, i: game.i, score: game.score, scored: game.scored, picks: game.picks };
  saveStore();
}

function setProgress(done) {
  const n = game.ids.length, f = done / n;
  $("fill").style.width = "calc((100% - 48px) * " + f + ")";
  $("me").style.right = "calc(6px + (100% - 48px) * " + f + ")";
  const left = n - done;
  $("caption").textContent = left <= 0 ? "סיימת." : left === 1 ? "נשארה שאלה אחת" : "נשארו " + left + " שאלות";
}

function renderQuestion() {
  const q = BY_ID[game.ids[game.i]], n = game.ids.length;
  game.answered = false;
  game.order = shuffle([0, 1, 2, 3].slice(0, q.options.length));
  $("counter").textContent = (game.i + 1) + "/" + n;
  $("scorePill").textContent = game.score + " נכונות";
  setProgress(game.i);

  const chips = $("chips"); chips.innerHTML = "";
  const chip = (txt, cls) => { const s = document.createElement("span"); s.className = "chip" + (cls ? " " + cls : ""); s.textContent = txt; chips.appendChild(s); };
  chip(CATS[q.cat] || q.cat);
  if (q.joke) chip("בדיחה, לא נספרת", "red");
  else { chip(DIFF[q.difficulty] || "בינונית"); if (q.funny) chip("עם חיוך", "red"); }

  $("qtext").textContent = q.q;
  const box = $("options"); box.innerHTML = "";
  game.order.forEach(idx => {
    const b = document.createElement("button");
    b.className = "opt glass"; b.dataset.idx = idx;
    const span = document.createElement("span"); span.textContent = q.options[idx];
    b.appendChild(span);
    b.addEventListener("click", () => answer(idx));
    box.appendChild(b);
  });
  $("feedback").hidden = true;
  $("nextBtn").hidden = true;
}

const CHECK = '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const CROSS = '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>';

function answer(idx) {
  if (game.answered) return;
  game.answered = true;
  const q = BY_ID[game.ids[game.i]], correct = idx === q.answer;

  document.querySelectorAll("#options .opt").forEach(b => {
    const bi = Number(b.dataset.idx);
    b.disabled = true;
    if (bi === q.answer) { b.classList.remove("glass"); b.classList.add(q.joke ? "punch" : "right"); if (!q.joke) b.insertAdjacentHTML("beforeend", CHECK); }
    else if (bi === idx) { b.classList.remove("glass"); b.classList.add("wrong"); b.insertAdjacentHTML("beforeend", CROSS); }
    else b.classList.add("gone");
  });

  const s = stat(q.id); s.seen++;
  const h = $("fbTitle");
  if (q.joke) { h.className = "lol"; h.textContent = correct ? "בדיוק הבדיחה." : "הבדיחה מסומנת למעלה."; }
  else {
    game.scored++; if (correct) { game.score++; s.right++; }
    h.className = correct ? "good" : "bad";
    h.textContent = pick(correct ? RIGHT : WRONG);
  }
  store.q[q.id] = s;
  game.picks[q.id] = idx;
  game.i++;            // saved as "next question", so leaving now keeps this answer
  persist();

  $("scorePill").textContent = game.score + " נכונות";
  $("fbText").textContent = q.explain || "";
  const src = $("fbSrc");
  if (q.source) { src.href = q.source; src.hidden = false; } else src.hidden = true;
  const fb = $("feedback"); fb.hidden = false; fb.scrollTop = 0;
  fb.classList.remove("show"); void fb.offsetWidth; fb.classList.add("show");

  const last = game.i >= game.ids.length;
  $("nextLabel").textContent = last ? "לסיכום" : "הבאה";
  $("nextBtn").hidden = false;
  setProgress(game.i);
  $("nextBtn").focus({ preventScroll: true });
}

function next() {
  if (game.i < game.ids.length) renderQuestion();
  else finish();
}

function quit() {
  if (game && game.i > 0 && game.i < game.ids.length) toast("נשמר. אפשר להמשיך מאותה שאלה.");
  renderHome(); show("home");
}

// ---------- results ----------
function verdictFor(p) {
  if (p === 1) return "מושלם.";
  if (p >= .8) return "מצוין.";
  if (p >= .6) return "יפה מאוד.";
  if (p >= .4) return "לא רע בכלל.";
  if (p > 0) return "יש עוד מה ללמוד. בשביל זה יש חידון.";
  return "אפס. גם זה הישג, מסוג מסוים.";
}

function finish() {
  delete store.saved[game.key];
  store.rounds = (store.rounds || 0) + 1; saveStore();
  const { score, scored } = game;
  $("scoreBig").innerHTML = score + "<small>/" + scored + "</small>";
  $("verdict").textContent = scored ? verdictFor(score / scored) : "רק בדיחות הפעם, בלי ניקוד.";
  const jokes = Object.keys(game.picks).filter(id => BY_ID[id] && BY_ID[id].joke).length;
  $("scoreSub").textContent = jokes ? "ועוד " + jokes + " בדיחות שלא נספרו." : "";
  const per = {};
  Object.entries(game.picks).forEach(([id, p]) => {
    const q = BY_ID[id]; if (!q || q.joke) return;
    per[q.cat] = per[q.cat] || [0, 0]; per[q.cat][1]++; if (p === q.answer) per[q.cat][0]++;
  });
  const ul = $("breakdown"); ul.innerHTML = "";
  Object.keys(per).forEach(c => {
    const li = document.createElement("li");
    const a = document.createElement("span"); a.textContent = CATS[c] || c;
    const b = document.createElement("span"); b.textContent = per[c][0] + " מתוך " + per[c][1];
    li.append(a, b); ul.appendChild(li);
  });
  ul.hidden = !Object.keys(per).length;
  show("results");
}

async function share() {
  const text = "עניתי נכון על " + game.score + " מתוך " + game.scored + " בחידון ידיעת הארץ. נסה בעצמך:";
  const url = location.href.split("#")[0];
  try { if (navigator.share) { await navigator.share({ title: "ידיעת הארץ", text, url }); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(text + " " + url); toast("הקישור הועתק."); } catch (e) { toast("לא הצלחתי להעתיק."); }
}

// ---------- home ----------
const accuracy = (qs) => {
  const seen = qs.filter(q => !q.joke && stat(q.id).seen);
  const pct = seen.length ? Math.round(seen.reduce((s, q) => s + stat(q.id).right / stat(q.id).seen, 0) / seen.length * 100) : 0;
  return { seen: seen.length, pct };
};
const resumeText = (key) => { const s = savedGame(key); return s ? "נעצרת בשאלה " + (s.i + 1) + " מתוך " + s.ids.length : null; };

function renderHome() {
  const total = QUESTIONS.length;
  document.querySelectorAll(".allN").forEach(e => e.textContent = total);
  const all = savedGame("all");
  $("mainT").innerHTML = all ? "להמשיך" : 'כל <span class="allN">' + total + "</span> השאלות";
  $("mainS").textContent = all ? "משאלה " + (all.i + 1) + " מתוך " + all.ids.length : "בסדר אקראי. אפשר לעצור באמצע.";
  $("restartAll").hidden = !all;
  $("funCount").textContent = MODES.fun.pool().length;
  $("hardCount").textContent = MODES.hard.pool().length;
  [["funBtn", "fun"], ["hardBtn", "hard"]].forEach(([btn, key]) => {
    const d = $(btn).querySelector(".d"); d.textContent = resumeText(key) || d.dataset.base;
  });
  const a = accuracy(QUESTIONS);
  $("statsA").textContent = a.seen ? "ענית על " + a.seen + " מתוך " + total : "עוד לא ענית על אף שאלה";
  $("statsB").textContent = a.seen ? a.pct + "% נכונות" : "";
  $("statsBar").style.width = Math.round(a.seen / total * 100) + "%";
}

// ---------- sheet: topics or levels ----------
function sheetRow(name, desc, count, onClick) {
  const b = document.createElement("button");
  b.className = "topic";
  b.innerHTML = '<span><span class="n"></span><span class="d"></span></span><span class="c"></span>';
  b.querySelector(".n").textContent = name;
  b.querySelector(".d").textContent = desc;
  b.querySelector(".c").textContent = count;
  b.addEventListener("click", onClick);
  return b;
}
function openSheet(kind) {
  const list = $("sheetList"); list.innerHTML = "";
  if (kind === "topics") {
    $("sheetTitle").textContent = "נושאים";
    Object.keys(CATS).forEach(c => {
      const key = "cat:" + c, qs = poolFor(key); if (!qs.length) return;
      const a = accuracy(qs);
      const desc = resumeText(key) || (a.seen ? "ענית על " + a.seen + ", " + a.pct + "% נכונות" : "עוד לא התחלת");
      list.appendChild(sheetRow(CATS[c], desc, qs.length, () => start(key)));
    });
  } else {
    $("sheetTitle").textContent = "לפי רמה";
    [1, 2, 3].forEach(d => {
      const key = "lvl" + d, qs = poolFor(key);
      const a = accuracy(qs);
      list.appendChild(sheetRow("שאלות " + LEVELS[d], resumeText(key) || (a.seen ? "ענית על " + a.seen + ", " + a.pct + "% נכונות" : "עוד לא התחלת"), qs.length, () => start(key)));
    });
  }
  $("sheetFoot").hidden = kind !== "topics";
  $("sheetBg").hidden = false; $("sheet").hidden = false; $("sheetClose").focus();
}
function closeSheet() { $("sheetBg").hidden = true; $("sheet").hidden = true; }

$("allBtn").onclick = () => start("all");
$("restartAll").onclick = () => start("all", true);
$("funBtn").onclick = () => start("fun");
$("hardBtn").onclick = () => start("hard");
$("levelBtn").onclick = () => openSheet("levels");
$("topicsBtn").onclick = () => openSheet("topics");
$("sheetClose").onclick = closeSheet;
$("sheetBg").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
$("nextBtn").onclick = next;
$("quitBtn").onclick = quit;
$("homeBtn").onclick = () => { renderHome(); show("home"); };
$("againBtn").onclick = () => start(game ? game.key : "all", true);
$("shareBtn").onclick = share;
$("resetBtn").onclick = () => {
  if (confirm("למחוק את כל ההתקדמות בטלפון הזה?")) { store = { q: {}, saved: {} }; saveStore(); renderHome(); openSheet("topics"); toast("ההתקדמות אופסה."); }
};

// install as an app
(function () {
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (standalone) return;
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) $("iosTip").hidden = false;
  addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    $("installBtn").hidden = false;
    $("installBtn").onclick = () => { e.prompt(); $("installBtn").hidden = true; };
  });
})();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

renderHome();
</script>
</body>
