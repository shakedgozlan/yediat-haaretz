  background-size: cover, 390px 844px;
  background-position: center, center top;
  color: var(--text);
  font-family: var(--body);
  font-weight: 400;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; font-weight: 400; }
a { color: var(--bone); }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

.glass {
  background: linear-gradient(135deg, rgba(26,42,29,0.96), rgba(12,22,15,0.94));
  -webkit-backdrop-filter: blur(10px) saturate(160%);
  backdrop-filter: blur(10px) saturate(160%);
  border: 1px solid rgba(230,238,212,0.5);
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.35), 0 12px 28px rgba(0,0,0,0.5);
}

.screen {
  display: none;
  height: 100vh; height: 100dvh;
  max-width: 480px; margin: 0 auto;
  padding: max(16px, env(safe-area-inset-top)) 20px max(16px, env(safe-area-inset-bottom));
  flex-direction: column; gap: var(--gap);
  position: relative; overflow-y: auto;
}
.screen.active { display: flex; }

/* hexagon button (topics / exit) */
.hex { position: relative; width: 50px; height: 56px; padding: 0; border: 0; background: none; display: grid; place-items: center; flex: none; }
.hex svg.shape { position: absolute; inset: 0; }
.hex svg.icon { position: relative; }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex: none; }
.pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 18px; font-size: 14px; }
.dot { width: 8px; height: 8px; border-radius: 4px; background: var(--green); box-shadow: 0 0 8px var(--green); }

/* home */
.hero { position: relative; flex: none; }
.hero h1 { margin: 0; font: 400 clamp(46px, 8.2vh, 70px)/0.92 var(--display); }
.hero p { margin: 6px 0 0; font-size: clamp(15px, 2.1vh, 18px); color: var(--bone); }
.here { position: absolute; left: 4px; top: 8px; width: 120px; height: 76px; pointer-events: none; }
.here .ring { position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 17px; border: 2px solid var(--red); box-shadow: 0 0 18px rgba(255,85,51,0.8); }
.here .core { position: absolute; left: 12px; top: 12px; width: 10px; height: 10px; border-radius: 5px; background: var(--red); }
.here .leg { position: absolute; left: 30px; top: 30px; width: 30px; height: 1px; background: var(--red); transform: rotate(35deg); transform-origin: 0 0; }
.here .tag { position: absolute; left: 50px; top: 44px; padding: 3px 8px; border: 1px solid rgba(255,85,51,0.7); background: rgba(14,24,16,0.85); font-size: 12px; color: #FFB3A3; white-space: nowrap; }

.cta {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; flex: none;
  padding: clamp(12px, 1.9vh, 16px) 18px clamp(12px, 1.9vh, 16px) 12px;
  border: 0; border-radius: 28px; background: var(--bone); color: var(--ink); text-align: right;
  box-shadow: 0 14px 30px rgba(0,0,0,0.45), inset 0 -3px 0 rgba(0,0,0,0.12);
}
.cta .t { display: block; font: 400 clamp(24px, 3.6vh, 30px)/1 var(--display); }
.cta .s { display: block; font-size: 14px; color: #3A4A33; margin-top: 4px; }
.cta .go { flex: none; width: clamp(44px, 6.4vh, 54px); height: clamp(44px, 6.4vh, 54px); border-radius: 50%; background: var(--ink); color: var(--bone); display: grid; place-items: center; }
.cta:active { transform: translateY(1px); }

.label { font-size: 15px; color: var(--bone); flex: none; }

.route { position: relative; display: flex; flex-direction: column; gap: clamp(6px, 1.2vh, 10px); padding-right: 30px; flex: none; }
.route::before { content: ""; position: absolute; right: 10px; top: 20px; bottom: 20px; border-right: 2px dashed var(--line); }
.stop { position: relative; }
.stop .pin { position: absolute; right: -29px; top: 50%; margin-top: -8px; width: 16px; height: 16px; border-radius: 8px; border: 2px solid var(--bone); background: var(--bg); }
.stop:first-child .pin { border-color: var(--red); box-shadow: 0 0 12px rgba(255,85,51,0.7); }
.mode { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: clamp(46px, 6.6vh, 56px); padding: 6px 16px; border-radius: 18px; text-align: right; color: var(--text); }
.mode .n { display: block; font-size: 18px; line-height: 1.2; }
.mode .d { display: block; font-size: 13px; color: var(--sub); }
.mode .c { font: 400 26px var(--display); color: var(--red-soft); }
.mode:disabled { opacity: .45; cursor: default; }

.stats { margin-top: auto; padding: 10px 14px; border-radius: 14px; display: flex; flex-direction: column; gap: 7px; flex: none; font-size: 13px; }
.stats .row { display: flex; justify-content: space-between; }
.bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--bone); border-radius: 2px; }

/* quiz */
.counter { font: 400 clamp(24px, 3.4vh, 28px) var(--display); direction: ltr; white-space: nowrap; }
.track { position: relative; height: 44px; flex: none; }
.track .dash { position: absolute; right: 6px; left: 42px; top: 21px; border-top: 2px dashed var(--line); }
.track .fill { position: absolute; right: 6px; top: 20px; height: 4px; border-radius: 2px; background: var(--bone); transition: width .4s ease; }
.track .start { position: absolute; right: 0; top: 16px; width: 12px; height: 12px; border-radius: 6px; background: var(--bone); }
.track .tick { position: absolute; top: 18px; width: 8px; height: 8px; margin-right: -4px; border-radius: 4px; background: rgba(230,238,212,0.35); }
.track .tick.done { background: var(--bone); }
.track .home { position: absolute; left: 0; top: 4px; width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; color: var(--red); }
.track .me { position: absolute; top: 7px; width: 30px; height: 30px; margin-right: -15px; border-radius: 15px; border: 2px solid var(--red); background: #0E1A10; box-shadow: 0 0 18px rgba(255,85,51,0.85); display: grid; place-items: center; transition: right .4s ease; }
.track .me i { width: 10px; height: 10px; border-radius: 5px; background: var(--red); }
.caption { font-size: 13px; color: var(--sub); margin-top: calc(var(--gap) * -0.6); flex: none; }

.qcard { padding: clamp(12px, 1.9vh, 16px) 18px; border-radius: 20px; background: #EEF3E2; color: var(--ink); box-shadow: 0 16px 34px rgba(0,0,0,0.55); flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chip { padding: 2px 10px; border-radius: 999px; font-size: 12px; background: rgba(22,35,26,0.12); }
.chip.red { background: var(--red); color: #fff; }
.qtext { margin: 0; font: 400 clamp(19px, 2.8vh, 23px)/1.3 var(--body); }

.options { display: flex; flex-direction: column; gap: 8px; flex: none; }
.opt {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: clamp(44px, 6vh, 50px); padding: 8px 16px; border-radius: 16px;
  color: var(--text); font-size: 17px; line-height: 1.3; text-align: right;
  transition: background-color .15s, opacity .2s, max-height .3s ease, min-height .3s ease, padding .3s ease, margin .3s ease;
  max-height: 120px; overflow: hidden;
}
.opt svg { flex: none; }
.opt.right { background: var(--green); border-color: var(--green); color: #10200F; }
.opt.wrong { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 10px 24px rgba(255,85,51,0.35); }
.opt.punch { background: var(--bone); color: var(--ink); }
.opt.gone { max-height: 0; min-height: 0; padding-top: 0; padding-bottom: 0; margin-top: -8px; opacity: 0; border-width: 0; }
.opt:disabled { cursor: default; }

.feedback { padding: 12px 16px; border-radius: 18px; flex: 0 1 auto; min-height: 0; overflow-y: auto; }
.feedback h3 { margin: 0 0 4px; font: 400 clamp(22px, 3.2vh, 27px)/1.1 var(--display); }
.feedback h3.good { color: var(--green); }
.feedback h3.bad { color: var(--red-soft); }
.feedback h3.lol { color: var(--bone); }
.feedback p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--sub); }
.feedback a { font-size: 13px; }
.show { animation: rise .25s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.next { margin-top: auto; flex: none; display: flex; align-items: center; justify-content: center; gap: 10px; height: clamp(50px, 7vh, 58px); border: 0; border-radius: 28px; background: var(--bone); color: var(--ink); font: 400 clamp(22px, 3.2vh, 26px) var(--display); box-shadow: 0 14px 30px rgba(0,0,0,0.45), inset 0 -3px 0 rgba(0,0,0,0.12); }

/* results */
.score { margin-top: clamp(8px, 4vh, 40px); font: 400 clamp(96px, 17vh, 150px)/0.9 var(--display); direction: ltr; text-align: right; flex: none; }
.score small { font-size: .4em; color: var(--sub); }
.verdict { margin: 0; font-size: clamp(19px, 2.8vh, 23px); flex: none; }
.sub { margin: 0; color: var(--sub); flex: none; }
.breakdown { list-style: none; margin: 0; padding: 4px 16px; border-radius: 18px; flex: 0 1 auto; overflow-y: auto; min-height: 0; }
.breakdown li { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid rgba(230,238,212,0.2); }
.breakdown li:last-child { border-bottom: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: none; }
.ghost { height: 50px; border-radius: 18px; font-size: 16px; }

/* topics sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 10; }
.sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 480px; max-height: 86dvh; overflow-y: auto; z-index: 11; padding: 18px 20px max(20px, env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0; animation: up .25s ease; }
@keyframes up { from { transform: translate(-50%, 30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.sheet-head h2 { margin: 0; font: 400 30px var(--display); }
.close { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; }
.topic { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 2px; border: 0; border-bottom: 1px solid rgba(230,238,212,0.2); background: none; text-align: right; }
.topic .n { display: block; font-size: 18px; }
.topic .d { display: block; font-size: 13px; color: var(--sub); }
.topic .c { font: 400 24px var(--display); color: var(--red-soft); }
.sheet-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 14px; font-size: 14px; }
.link { background: none; border: 0; padding: 6px 0; text-decoration: underline; color: var(--sub); }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: 99px; background: var(--bone); color: var(--ink); font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; white-space: nowrap; }
.toast.on { opacity: 1; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.restart { align-self: flex-start; background: none; border: 0; padding: 2px 4px; margin-top: calc(var(--gap) * -0.5); font-size: 14px; color: var(--sub); text-decoration: underline; flex: none; }
.mode .chev { color: var(--sub); }
.brand { font-size: 14px; color: var(--sub); }
</style>
</head>

    <span class="brand">החידון של המילואים</span>
    <button class="hex" id="topicsBtn" aria-label="נושאים">
      <svg class="shape" aria-hidden="true" width="50" height="56" viewBox="0 0 52 58"><path d="M26 2 L49 15 L49 43 L26 56 L3 43 L3 15 Z" fill="rgba(14,24,16,0.9)" stroke="rgba(230,238,212,0.7)" stroke-width="1.4"/></svg>
      <svg class="icon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
    </button>

    <span class="go" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></span>

</section>

</section>

  <ul class="breakdown glass" id="breakdown"></ul>

    <span class="go" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></span>

const QUESTIONS = [{"id":"geo-001","cat":"geography","q":"איזה חלק משטח מדינת ישראל תופס הנגב?","options":["יותר ממחצית","כרבע","כשליש","כ-10%"],"answer":0,"explain":"הנגב בנוי כמשולש: הבסיס באזור באר שבע והקודקוד באילת. המקורות לא מסכימים על השטח המדויק בקמ\"ר, אבל כולם מסכימים שזה יותר מחצי המדינה.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Geography_of_Israel"},{"id":"geo-002","cat":"geography","q":"איזה עמק מחבר בין מישור החוף באזור חיפה לבין בקע הירדן?","options":["עמק החולה","עמק יזרעאל","עמק האלה","עמק בית הכרם"],"answer":1,"explain":"אורכו כ-48 ק\"מ, ובלועזית הוא נקרא \"מישור אסדרלון\". הקישון זורם בחלקו המערבי ונשפך לים באזור חיפה.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Geography_of_Israel"},{"id":"geo-003","cat":"geography","q":"השרון, האזור הצפוף ביותר באוכלוסייה בישראל, נמתח בין שני נחלים. אילו?","options":["נחל הקישון ונחל חדרה","הירקון ונחל שורק","נחל תנינים והירקון","נחל אלכסנדר ונחל לכיש"],"answer":2,"explain":"השרון הוא חלק ממישור החוף. בדרך בין נחל תנינים בצפון לירקון בדרום עוברים עוד נחלי חוף: חדרה, אלכסנדר ופולג.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Geography_of_Israel"},{"id":"geo-004","cat":"geography","q":"מצפה השלגים בחרמון נחשב לנקודה הגבוהה ביותר בישראל. מה גובהו בערך?","options":["כ-1,200 מטר","כ-2,800 מטר","כ-3,500 מטר","כ-2,200 מטר"],"answer":3,"explain":"כ-2,224 עד 2,236 מטר, תלוי באיזו פסגה מדובר. פסגת החרמון עצמה, 2,814 מטר, נמצאת בשטח סוריה, ומאז דצמבר 2024, אחרי נפילת משטר אסד, מוצב בה צה\"ל.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Mount_Hermon"},{"id":"geo-005","cat":"geography","q":"איפה נמצאת הנקודה הנמוכה ביותר ביבשה על פני כדור הארץ?","options":["חופי ים המלח","עמק המוות בקליפורניה","שקע עפר בג'יבוטי","חופי הכנרת"],"answer":0,"explain":"והיא ממשיכה לרדת: מפלס ים המלח יורד בכל שנה, ולכן כל מקור נותן מספר אחר לגובה שלו.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Dead_Sea"},{"id":"geo-006","cat":"geography","q":"מאיפה הגיע השם \"מכתש\" לתופעה הגאולוגית שבנגב?","options":["ממכה של מטאוריט","מכלי לכתישה, מכתש ועלי","מלוע של הר געש","ממילה בערבית שפירושה \"בור\""],"answer":1,"explain":"מכתש לא נוצר ממטאוריט וגם לא מהר געש, אלא מסחיפה של סלעים רכים בתוך קמר. כך שהשם האנגלי \"Ramon Crater\" בעצם מטעה.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Makhtesh"},{"id":"geo-007","cat":"geography","q":"הרכבת לאילת עדיין לא נבנתה. מתי התחילו להבטיח אותה?","options":["ב-2010","ב-1990","כבר אחרי מלחמת העצמאות","ב-1977"],"answer":2,"explain":"היא בוטלה ב-1952, הוחלט עליה שוב ב-1955 בימי בן-גוריון, ומאז אושרה והוקפאה שוב ושוב. בינתיים התחנה הדרומית ביותר היא דימונה, שהיא גם התחנה עם הכי מעט נוסעים בארץ.","difficulty":1,"funny":true,"source":"https://en.wikipedia.org/wiki/High-speed_railway_to_Eilat"},{"id":"geo-008","cat":"geography","q":"מהו ההר הגבוה ביותר בתחומי הקו הירוק?","options":["הר תבור","הר הכרמל","הר כנען","הר מירון"],"answer":3,"explain":"גובהו כ-1,200 מטר (המקורות חלוקים בכמה מטרים). בהר שמורת טבע גדולה שהוכרזה ב-1965, ובו גם קבר רבי שמעון בר יוחאי.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Mount_Meron"},{"id":"geo-009","cat":"geography","q":"מהו היובל הגדול ביותר של הירדן התחתון, דרומית לכנרת?","options":["הירמוך","נחל תבור","נחל עמוד","הקישון"],"answer":0,"explain":"ולירדן התחתון מגיע היום מעט מאוד מים: עד 95% ממי הירדן מוסטים לשימוש אנושי, ומחקר מ-2010 העריך שנשאר רק כ-2% מהזרימה ההיסטורית.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Jordan_River"},{"id":"geo-010","cat":"geography","q":"כמה מכתשים יש בישראל?","options":["שלושה","חמישה","אחד בלבד","שבעה"],"answer":1,"explain":"רמון, הגדול, הקטן ושניים קטנים בהר עריף, כולם בנגב. \"המכתש הגדול\" קיבל את שמו כשחשבו שהוא הגדול ביותר, עוד לפני שמיפו את מכתש רמון.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Makhtesh"},{"id":"geo-011","cat":"geography","q":"איזה יישוב מכונה \"אם המושבות\"?","options":["ראשון לציון","זכרון יעקב","פתח תקווה","ראש פינה"],"answer":2,"explain":"פתח תקווה נוסדה ב-1878 כיישוב החקלאי היהודי המודרני הראשון בארץ. מגפת מלריה גרמה לנטישתה, והיא חודשה ב-1883.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Petah_Tikva"},{"id":"geo-012","cat":"geography","q":"עיר ישראלית קיבלה את שמה בזכות לוס אנג'לס. איזו?","options":["אשקלון","קריית גת","נתיבות","קריית מלאכי"],"answer":3,"explain":"יהדות לוס אנג'לס מימנה חלק גדול מהקמתה ב-1951, כמעברה, ו\"לוס אנג'לס\" בספרדית פירושו \"המלאכים\".","difficulty":2,"funny":true,"source":"https://en.wikipedia.org/wiki/Kiryat_Malakhi"},{"id":"geo-013","cat":"geography","q":"מכתש רמון הוא המכתש הגדול בעולם. מה אורכו בערך?","options":["כ-40 ק\"מ","כ-4 ק\"מ","כ-10 ק\"מ","כ-100 ק\"מ"],"answer":0,"explain":"רוחבו 2 עד 10 ק\"מ ועומקו כ-500 מטר. בתוכו \"המנסרה\", גבעת אבן חול שהתגבשה לעמודים מצולעים, ו\"קיר האמוניטים\" עם מאובנים ספירליים.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Makhtesh_Ramon"},{"id":"geo-014","cat":"geography","q":"ממה עשוי הר סדום, שבדרום-מערב ים המלח?","options":["אבן גיר","מלח","בזלת של הר געש כבוי","אבן חול אדומה"],"answer":1,"explain":"כ-80% ממנו מלח (הליט), והוא מתנשא כ-220 מטר מעל ים המלח. אחד מעמודי המלח שהתנתקו ממנו מכונה \"אשת לוט\", על שם האישה שהפכה לנציב מלח.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Mount_Sodom"},{"id":"geo-015","cat":"geography","q":"איזה תואר עולמי מחזיקה הכנרת?","options":["אגם המים המתוקים העמוק בעולם","האגם הצעיר בעולם","אגם המים המתוקים הנמוך בעולם","האגם המלוח הקטן בעולם"],"answer":2,"explain":"היא גם האגם השני הכי נמוך בעולם בכלל, אחרי ים המלח. היקפה כ-53 ק\"מ, וזה הבסיס ל\"סובב כנרת\".","difficulty":1,"source":"https://en.wikipedia.org/wiki/Sea_of_Galilee"},{"id":"geo-016","cat":"geography","q":"מה קורה כשמפלס הכנרת מגיע לקו האדום העליון?","options":["מפסיקים לשאוב ממנה","נגרם נזק בלתי הפיך","מכריזים רשמית על בצורת","מתחילות הצפות בחופים"],"answer":3,"explain":"יש שלושה קווים: האדום העליון (208.9 מטר מתחת לפני הים), שבו מתחילות הצפות; האדום התחתון (213.2), שבו אמורים להפסיק לשאוב; והשחור, שמתחתיו נגרם נזק בלתי הפיך.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Sea_of_Galilee"},{"id":"geo-017","cat":"geography","q":"עשרות שנים המוביל הארצי לקח מים מהכנרת. מה קורה מאז אוקטובר 2025?","options":["מזרימים אליה מים מותפלים","מייבאים לה מים מטורקיה","מזרימים אליה מים מים המלח","הפסיקו לגמרי לשאוב ממנה"],"answer":0,"explain":"מי ים תיכון מותפלים זורמים לכנרת דרך \"המוביל הארצי ההפוך\". ובספטמבר 2026, כשמתקני ההתפלה בדרום הושבתו בגלל פריחת אצות, שאבו שוב מהכנרת כ-3.3 מיליון מ\"ק.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Sea_of_Galilee"},{"id":"geo-018","cat":"geography","q":"איזה דג מזוהה עם הכנרת ומכונה גם \"דג פטרוס\"?","options":["לברק","אמנון","בורי","שפמנון"],"answer":1,"explain":"בערבית קוראים לו \"מושט\". והכנרת שומרת עוד הפתעות: ב-1986 נמצאה בחופה סירת דייגים עתיקה מימי הבית השני, \"סירת ישו\".","difficulty":1,"source":"https://en.wikipedia.org/wiki/Sea_of_Galilee"},{"id":"geo-019","cat":"geography","q":"מה פירוש השם עין גדי?","options":["מעיין הגיבור","מעיין הגדוד","מעיין הגדי","מעיין הגדה"],"answer":2,"explain":"גדי הוא גור עיזים, ובשמורה באמת רואים יעלים ושפנים. זורמים בה שני נחלים כל השנה, נחל דוד ונחל ערוגות, ומבקרים בה כמיליון איש בשנה.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Ein_Gedi_Nature_Reserve"},{"id":"geo-020","cat":"geography","q":"מאיפה נלקח השם \"תל אביב\"?","options":["מהספר \"מדינת היהודים\"","משיר של ביאליק","משם של כפר ערבי סמוך","מתרגום \"אלטנוילנד\" של הרצל"],"answer":3,"explain":"נחום סוקולוב תרגם את \"אלטנוילנד\" (\"ארץ ישנה-חדשה\") ולקח את השם מספר יחזקאל. \"תל\" הוא גבעה של שכבות יישוב עתיקות ו\"אביב\" הוא התחדשות: ישן-חדש.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Tel_Aviv"},{"id":"geo-021","cat":"geography","q":"תל אביב התחילה כשכונה של יפו. באיזו שנה אוחדו השתיים לעיר \"תל אביב-יפו\"?","options":["1950","1934","1948","1967"],"answer":0,"explain":"ב-1934 קיבלה תל אביב מעמד של עיר עצמאית, ובסוף \"בלעה\" את העיר שממנה יצאה. השם תל אביב-יפו נקבע ב-19 באוגוסט 1950.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Tel_Aviv"},{"id":"geo-022","cat":"geography","q":"אילו שני אתרים בישראל הוכרזו ראשונים, ב-2001, כאתרי מורשת עולמית של אונסק\"ו?","options":["העיר הלבנה וקיסריה","מצדה והעיר העתיקה של עכו","בית שערים ומגידו","ים המלח ומכתש רמון"],"answer":1,"explain":"מצדה מתנשאת כ-400 מטר מעל סביבתה בצד ים המלח. הורדוס בנה בה ארמונות, כולל \"הארמון הצפוני\" שיושב על שלוש מדרגות מצוק.","difficulty":1,"source":"https://en.wikipedia.org/wiki/List_of_World_Heritage_Sites_in_Israel"},{"id":"geo-023","cat":"geography","q":"כמה אתרי מורשת עולמית של אונסק\"ו רשומים תחת ישראל?","options":["3","15","9","25"],"answer":2,"explain":"האחרון שנוסף הוא נקרופוליס בית שערים (2015). לישראל יש עוד 18 אתרים ברשימה המועמדת.","difficulty":2,"source":"https://whc.unesco.org/en/statesparties/il"},{"id":"geo-024","cat":"geography","q":"אילו שלושה תלים הוכרזו ב-2005 כאתר המורשת העולמית \"תילי המקרא\"?","options":["מגידו, לכיש ודן","חצור, שילה וגזר","באר שבע, ערד ובית שאן","מגידו, חצור ובאר שבע"],"answer":3,"explain":"ועובדה בונוס: כל 9 אתרי המורשת העולמית בישראל הם אתרי תרבות. ים המלח ומכתש רמון לא ברשימה, ו\"ארץ המכתשים\" נמצאת רק ברשימה המועמדת.","difficulty":3,"source":"https://en.wikipedia.org/wiki/List_of_World_Heritage_Sites_in_Israel"},{"id":"geo-025","cat":"geography","q":"מהו המפל הגבוה בישראל, כ-51 מטר?","options":["מפל גמלא","מפל הבניאס","מפל התנור","מפל דוד בעין גדי"],"answer":0,"explain":"שמורת גמלא היא גם מושבת הקינון הגדולה של עופות דורסים בישראל, עם עשרות זוגות נשרים. השם בא מ\"גמל\": מרחוק הגבעה נראית כמו דבשת.","difficulty":2,"source":"https://static-en.parks.org.il/wp-content/uploads/2019/09/gamla_eng-for-internet.pdf"},{"id":"geo-026","cat":"geography","q":"מאיפה בא השם \"בניאס\"?","options":["ממילה בערבית שפירושה \"מרחץ\"","מהאל היווני פאן","משמו של מושל רומי","מהמילה העברית \"בנייה\""],"answer":1,"explain":"העיר נקראה \"פניאס\", ובערבית אין הגה \"פ\", אז ה-P הפכה ל-B. מהמעיין יוצא נחל חרמון, אחד משלושת מקורות הירדן (הגדול שבהם הוא דווקא הדן).","difficulty":3,"source":"https://en.wikipedia.org/wiki/Banias"},{"id":"geo-027","cat":"geography","q":"מגרעין תמר בן כ-2,000 שנה שנמצא במצדה הנביטו עץ. איך הוא מכונה?","options":["שמשון","בר כוכבא","מתושלח","הורדוס"],"answer":2,"explain":"ועוד ממצדה: יוספוס כתב על 960 הרוגים במצור הרומי, אבל הארכאולוגים מצאו שרידים של 28 אנשים לכל היותר.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Masada"},{"id":"geo-028","cat":"geography","q":"\"עמודי שלמה\" בתמנע: מה בדיוק עשה שם שלמה המלך?","options":["חצב אותם לבניית המקדש","בנה שם בית קיץ למלכת שבא","כרה שם זהב לכתר","כלום. השם פשוט נשאר"],"answer":3,"explain":"את השם נתן הארכאולוג נלסון גליק בשנות ה-30. ההשערה שלו לא התקבלה, אבל השם נשאר. העמודים הם תצורות סחיפה טבעיות, ולפי חפירות מאוחרות דווקא האדומים עבדו בחלק ממכרות הנחושת.","difficulty":2,"funny":true,"source":"https://en.wikipedia.org/wiki/Timna_Valley"},{"id":"geo-029","cat":"geography","q":"כן, בנחל תנינים באמת היו תנינים. האחרון ניצוד ב-1912. איפה הוא נמצא היום?","options":["מפוחלץ במוזיאון הטבע בתל אביב","בספארי ברמת גן, בפנסיה","בחוות התנינים בחמת גדר","בגן החיות התנ\"כי בירושלים"],"answer":0,"explain":"תניני יאור חיו בביצות כבארה עד תחילת המאה ה-20. הפוחלץ של האחרון מוצג במוזיאון הטבע של אוניברסיטת תל אביב.","difficulty":2,"funny":true,"source":"https://en.wikipedia.org/wiki/Nahal_Taninim"},{"id":"geo-030","cat":"geography","q":"שביל ישראל נמתח מצפון הארץ ועד אילת. מה אורכו בערך?","options":["כ-300 ק\"מ","כ-1,000 ק\"מ","כ-500 ק\"מ","כ-2,500 ק\"מ"],"answer":1,"explain":"המקורות נותנים אורכים שונים, בין כ-1,000 לכ-1,100 ק\"מ. מסע שלם לוקח בממוצע 45 עד 60 ימים, ו\"מלאכי השביל\" מארחים מטיילים בחינם.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Israel_National_Trail"},{"id":"geo-031","cat":"geography","q":"סימון שביל ישראל מורכב משלושה פסים. באילו צבעים?","options":["ירוק, לבן ואדום","כחול, לבן וצהוב","לבן, כחול וכתום","כתום, שחור וצהוב"],"answer":2,"explain":"את השביל הגו העיתונאי אברהם תמיר, שהלך בשביל האפלצ'ים בארה\"ב, ועורי דביר מהחברה להגנת הטבע. ב-2012 כללה אותו נשיונל ג'יאוגרפיק ברשימת השבילים ה\"אפיים\" בעולם.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Israel_National_Trail"},{"id":"geo-032","cat":"geography","q":"כביש 90 מתחיל בטאבה ומסתיים בגבול לבנון ליד מטולה. מה אורכו בערך?","options":["כ-150 ק\"מ","כ-250 ק\"מ","כ-900 ק\"מ","כ-480 ק\"מ"],"answer":3,"explain":"הוא עובר לאורך השבר הסורי-אפריקאי, והקטע שלו לאורך ים המלח הוא הכביש הנמוך בעולם. הקטע הוותיק ביותר, טבריה-מטולה, הוא עוד מהתקופה העות'מאנית.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Highway_90_(Israel)"},{"id":"geo-033","cat":"geography","q":"בבקעת הירדן יש כביש בשם \"דרך גנדי\". על שם מי הוא נקרא?","options":["השר רחבעם זאבי","מהטמה גנדי, שליח השלום","אינדירה גנדי, כמחווה להודו","מסעדה הודית ותיקה בצומת"],"answer":0,"explain":"רחבעם זאבי, שכינויו היה \"גנדי\", היה גנרל ולימים שר.","difficulty":2,"funny":true,"source":"https://en.wikipedia.org/wiki/Highway_90_(Israel)"},{"id":"geo-034","cat":"geography","q":"לכביש 6 יש שם רשמי שכמעט אף אחד לא משתמש בו. מהו?","options":["דרך בן-גוריון","דרך יצחק רבין","דרך מנחם בגין","דרך הרצל"],"answer":1,"explain":"הכביש פועל מאז 2002, והוא הכביש הראשון בישראל שנבנה בזכיינות פרטית (BOT). אין בו תאי תשלום: מצלמות מזהות את הרכב והחשבון נשלח בדואר.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Highway_6_(Israel)"},{"id":"geo-035","cat":"geography","q":"על שם מי נקרא נמל התעופה רמון, שנפתח ב-2019 ליד אילת?","options":["מכתש רמון","הר רמון","האסטרונאוט אילן רמון ובנו אסף","נחל רמון"],"answer":2,"explain":"הנמל החליף את שדה התעופה של אילת, שנסגר במרץ 2019. יש בו גדר נגד טילים בגובה 26 מטר, שמתוארת כגבוהה בעולם.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Ramon_Airport"},{"id":"geo-036","cat":"geography","q":"תחנת ירושלים-יצחק נבון, בקו המהיר לירושלים, נמצאת עמוק מתחת לקרקע. כמה עמוק בערך?","options":["כ-10 מטר","כ-30 מטר","כ-200 מטר","כ-80 מטר"],"answer":3,"explain":"הקו נפתח ב-2018, ומנהרה 3 שלו (כ-11.6 ק\"מ) היא המנהרה הארוכה בישראל. ולמרות הכינוי, לפי ההגדרה הבינלאומית זו לא רכבת מהירה: היא נוסעת עד 160 קמ\"ש, מתחת לסף של 250.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Tel_Aviv%E2%80%93Jerusalem_railway"},{"id":"geo-037","cat":"geography","q":"נתניה נקראה על שם נתן שטראוס, פילנתרופ יהודי-אמריקאי. במה הוא היה מפורסם בארה\"ב?","options":["שותף ברשת הכלבו מייסי'ס","מייסד אולפני האחים וורנר","ממציא מכנסי הג'ינס של ליוויס","ראש עיריית ניו יורק"],"answer":0,"explain":"העיר נוסדה ב-1929, והשם ניתן לה בתקווה ששטראוס יתרום למייסדיה. כשכבר לא היה לו מה לתת, השם נשאר. היום יש לנתניה כ-14 ק\"מ של חופים.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Netanya"},{"id":"geo-038","cat":"geography","q":"הכרמלית בחיפה: רכבת תחתית עם 6 תחנות. מה מיוחד בקרונות שלה?","options":["אין בהם חלונות, לחיסכון","הם משופעים, ויש בתוכם מדרגות","הם צבועים בצבעי מכבי חיפה","הם נוסעים רק בירידה"],"answer":1,"explain":"הפרש הגובה בין התחנות הקיצוניות הוא 274 מטר. הכרמלית נפתחה ב-1959, והייתה מערכת התחבורה התת-קרקעית היחידה בישראל עד הרכבת הקלה בתל אביב ב-2023.","difficulty":2,"funny":true,"source":"https://en.wikipedia.org/wiki/Carmelit"},{"id":"geo-039","cat":"geography","q":"עם כמה מדינות יש לישראל גבול יבשתי?","options":["3","2","4","6"],"answer":2,"explain":"לבנון בצפון, סוריה בצפון-מזרח, ירדן במזרח ובדרום-מזרח ומצרים בדרום-מערב.","difficulty":1,"source":"https://www.britannica.com/place/Israel"},{"id":"geo-040","cat":"geography","q":"מאילת רואים שלוש מדינות שכנות. איזו מהבאות אינה אחת מהן?","options":["מצרים","ירדן","סעודיה","סודן"],"answer":3,"explain":"רואים את טאבה במצרים, את עקבה בירדן ואת חקל בסעודיה, מעבר למפרץ. ובאילת עצמה יש כ-360 ימי שמש בשנה.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Eilat"},{"id":"geo-041","cat":"geography","q":"הר מירון הוא המקום השני הכי גשום בישראל. מי במקום הראשון?","options":["החרמון","הכרמל","ירושלים","ראש הנקרה"],"answer":0,"explain":"כמויות הגשם בישראל נעות מכ-30 מ\"מ בשנה בדרום הקיצוני ועד יותר מ-900 מ\"מ בצפון, ויותר מ-70% מהגשם יורד בין נובמבר למרץ.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Mount_Meron"},{"id":"geo-042","cat":"geography","q":"ב-2008 נבחרה הדוכיפת לציפור הלאומית. מה הבעיה הקטנה איתה?","options":["היא לא חיה בישראל","היא לא כשרה","היא נכחדה מזמן","היא לא יודעת לעוף"],"answer":1,"explain":"הדוכיפת מופיעה בספר ויקרא ברשימת העופות האסורים באכילה. היא ניצחה בסקר שבו הצביעו כ-155,000 איש, והנשר נפסל כי נחשב \"אלים\" מדי.","difficulty":2,"funny":true,"source":"https://www.nbcnews.com/id/wbna24875880"},{"id":"geo-043","cat":"geography","q":"איזו ציפור נודדת חונה בעשרות אלפים באגמון החולה בכל חורף?","options":["החסידה הלבנה","הפלמינגו","העגור","השקנאי"],"answer":2,"explain":"העגורים עוצרים בחולה בדרכם מפינלנד לאתיופיה. שמורת החולה, שהוכרזה ב-1963, הייתה שמורת הטבע הראשונה בישראל.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Hula_Valley"},{"id":"geo-044","cat":"geography","q":"איזה בעל חיים הוכרז ככחוד ב-1996, ובנובמבר 2011 התגלה מחדש בעמק החולה?","options":["צבי ארץ-ישראלי","תנין היאור","נמר","אגולשון החולה"],"answer":3,"explain":"זו צפרדע, והיום היא מוגדרת בסכנת הכחדה חמורה. ייבוש אגם החולה בשנות ה-50 גרם להכחדה של כמה מיני דגים מקומיים, ובתחילת שנות ה-90 חלק מהעמק הוצף מחדש.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Hula_Valley"},{"id":"geo-045","cat":"geography","q":"איך נקרא העמק המדברי שנמתח מדרום לים המלח ועד אילת?","options":["הערבה","בקעת הירדן","בקעת באר שבע","עמק החולה"],"answer":0,"explain":"הערבה היא חלק מהשבר הסורי-אפריקאי ואחד האזורים היבשים בארץ: יורדים בה רק כ-50 מ\"מ גשם בשנה.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Geography_of_Israel"},{"id":"hist-001","cat":"history","q":"מי החריב את בית המקדש הראשון?","options":["נבוכדנצר השני מלך בבל","סנחריב מלך אשור","טיטוס הרומאי","כורש מלך פרס"],"answer":0,"explain":"המלך האחרון של יהודה היה צדקיהו. החוקרים עדיין מתווכחים אם החורבן היה ב-587 או ב-586 לפנה\"ס.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Siege_of_Jerusalem_(587_BC)"},{"id":"hist-002","cat":"history","q":"ממלכת ישראל הצפונית, שבירתה שומרון, נפלה בידי איזו אימפריה?","options":["בבל","מצרים","פרס","אשור"],"answer":3,"explain":"המצור התחיל בימי שלמנאסר החמישי והסתיים בימי סרגון השני. מכאן נולדה המסורת על עשרת השבטים האבודים.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Kingdom_of_Israel_(Samaria)"},{"id":"hist-003","cat":"history","q":"מרד החשמונאים פרץ במודיעין ב-167 לפנה\"ס. נגד גזרותיו של מי?","options":["הקיסר הרומי טיטוס","נבוכדנצר מלך בבל","אנטיוכוס הרביעי, המלך הסלאוקי","הקיסר אדריאנוס"],"answer":2,"explain":"מתתיהו הכהן סירב להקריב לאלים היווניים, והרג את היהודי שהסכים לעשות זאת ואת הפקיד היווני. הוא מת כשנה אחר כך.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Maccabean_Revolt"},{"id":"hist-004","cat":"history","q":"מי היה השליט הראשון של שושלת החשמונאים, שהשיג עצמאות מהסלאוקים בסביבות 142 לפנה\"ס?","options":["יהודה המכבי","שמעון החשמונאי","יוחנן הורקנוס","אלכסנדר ינאי"],"answer":1,"explain":"שמעון היה האח האחרון ששרד. יהודה המכבי עצמו נפל בקרב אלעשה ב-160 לפנה\"ס ולא זכה לראות את העצמאות.","difficulty":3,"source":"https://www.britannica.com/topic/Hasmonean-dynasty"},{"id":"hist-005","cat":"history","q":"הכותל המערבי הוא בעצם...","options":["קיר תמך של רחבת הר הבית","קיר של בית המקדש עצמו","חומת העיר מימי שלמה","חומה שבנו העות'מאנים"],"answer":0,"explain":"את רחבת הר הבית הרחיב הורדוס, שבנה גם את נמל קיסריה, את הארמונות במצדה ואת ההרודיון.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Herod_the_Great"},{"id":"hist-006","cat":"history","q":"באיזו שנה חרב בית המקדש השני?","options":["135 לספירה","63 לפנה\"ס","586 לפנה\"ס","70 לספירה"],"answer":3,"explain":"את דיכוי המרד הגדול התחיל אספסיאנוס בשליחות נירון, ואת המלאכה סיים בנו טיטוס. לפי המסורת, הבית חרב בט' באב.","difficulty":1,"source":"https://www.britannica.com/event/First-Jewish-Revolt"},{"id":"hist-007","cat":"history","q":"לפי המסורת, רבן יוחנן בן זכאי הוברח מירושלים הנצורה בארון מתים. היכן הקים מרכז לימוד?","options":["ציפורי","טבריה","יבנה","אושא"],"answer":2,"explain":"המרכז ביבנה, שהרומאים התירו להקים, אפשר ליהדות להמשיך להתקיים גם בלי בית מקדש.","difficulty":2,"source":"https://www.britannica.com/biography/Johanan-ben-Zakkai"},{"id":"hist-008","cat":"history","q":"מה היה שמו האמיתי של בר כוכבא, כפי שהתגלה באיגרות שלו?","options":["שמעון בר גיורא","שמעון בר כוסבה","אלעזר בן יאיר","יוחנן בן לוי"],"answer":1,"explain":"\"בר כוכבא\" הוא כינוי משיחי לפי הפסוק \"דרך כוכב מיעקב\", שרבי עקיבא ייחס לו. בתלמוד הוא נקרא \"בר כוזיבא\".","difficulty":2,"source":"https://en.wikipedia.org/wiki/Simon_bar_Kokhba"},{"id":"hist-009","cat":"history","q":"בר כוכבא, מנהיג המרד ברומאים, בין קרב לקרב: מה הוא דרש באחת מאיגרותיו שיביאו לו?","options":["לולבים ואתרוגים לסוכות","מצות לפסח","שמן לחנוכה","שופר לראש השנה"],"answer":0,"explain":"הנימוק באיגרת: \"המחנה גדול\". באיגרת אחרת הוא כותב שנמאס לו מהגלילאים ומאיים לשים אזיקים ברגלי אנשיו.","difficulty":2,"funny":true,"source":"https://cojs.org/simon-bar-kokhba-132-135-c-sukkot/"},{"id":"hist-010","cat":"history","q":"מי בנה את כיפת הסלע, שהושלמה ב-691 או 692?","options":["צלאח א-דין","סולימאן המפואר","הח'ליף עומר בן אל-ח'טאב","הח'ליף האומיי עבד אל-מלכ"],"answer":3,"explain":"הכינוי \"מסגד עומר\" מטעה: כיפת הסלע איננה מסגד אלא מבנה זיכרון, והיא המבנה האסלאמי העתיק ביותר ששרד.","difficulty":2,"source":"https://www.britannica.com/topic/Dome-of-the-Rock"},{"id":"hist-011","cat":"history","q":"רמלה נוסדה במאה ה-8 כבירת המחוז \"ג'ונד פלסטין\". ממה נגזר שמה?","options":["מהמילה העברית \"רמה\"","משם המייסד שלה","מהמילה הערבית לחול","מהמילה הערבית למעיין"],"answer":2,"explain":"את העיר ייסד סולימאן בן עבד אל-מלכ. בריכת הקשתות שבה נבנתה ב-789, בימי הארון א-רשיד.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Ramla"},{"id":"hist-012","cat":"history","q":"מי הביס את הצבא הצלבני בקרב קרני חיטין ב-1187?","options":["בייברס","צלאח א-דין","נור א-דין","ריצ'רד לב הארי"],"answer":1,"explain":"הקרב נערך ליד טבריה ופתח לצלאח א-דין את הדרך לכיבוש ירושלים, באוקטובר של אותה שנה.","difficulty":1,"source":"https://www.britannica.com/event/Battle-of-Hattin"},{"id":"hist-013","cat":"history","q":"מה נכון לגבי ריצ'רד לב הארי במסע הצלב השלישי?","options":["מעולם לא נכנס לירושלים","כבש את ירושלים ב-1191","הוכתר למלך ירושלים","נהרג בקרב חיטין"],"answer":0,"explain":"הוא ניצח את צלאח א-דין בקרב ארסוף, אבל בהסכם יפו (1192) נשארה ירושלים בידי המוסלמים, ועולי רגל נוצרים לא חמושים הורשו לבקר בה.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Third_Crusade"},{"id":"hist-014","cat":"history","q":"בקרב עין ג'אלות ב-1260, מי ניצח את מי?","options":["הממלוכים את הצלבנים","העות'מאנים את הממלוכים","צלאח א-דין את המונגולים","הממלוכים את המונגולים"],"answer":3,"explain":"הקרב, שנקרא גם \"מעיין גוליית\", בלם את התפשטות המונגולים מערבה. בראש הממלוכים עמדו הסולטאן קוטוז והמצביא בייברס.","difficulty":3,"source":"https://www.britannica.com/event/Battle-of-Ayn-Jalut"},{"id":"hist-015","cat":"history","q":"העות'מאנים כבשו את הארץ מהממלוכים ב-1516. כמה זמן בערך שלטו בה?","options":["כ-100 שנה","כ-200 שנה","כ-400 שנה","כ-700 שנה"],"answer":2,"explain":"השלטון העות'מאני התחיל בימי הסולטאן סלים הראשון, אחרי קרב מרג' דאבק, ונגמר ב-1917 עם כניסת הבריטים.","difficulty":1,"source":"https://www.britannica.com/place/Palestine/The-Crusades"},{"id":"hist-016","cat":"history","q":"לפי הסיפור המקובל, כשראש עיריית ירושלים יצא להיכנע לבריטים ב-1917, למי ניסה להיכנע ראשון?","options":["לגנרל אלנבי בשער יפו","לשני טבחים שחיפשו ביצים","לפרש אוסטרלי","למפעיל טלגרף"],"answer":1,"explain":"הדגל הלבן היה סדין מבית החולים האיטלקי, קשור למקל מטאטא. אחרי הטבחים הגיעו שני סמלים שסירבו לקבל את הכניעה אבל הסכימו להצטלם, ובסוף נערכו כמה טקסי כניעה כי כל גנרל רצה אחד משלו.","difficulty":2,"funny":true,"source":"https://blog.nli.org.il/en/hoi_jerusalem_surrender/"},{"id":"hist-017","cat":"history","q":"ב-15 במאי 1948 פלשו לארץ צבאות חמש מדינות ערב. איזו מהבאות לא הייתה ביניהן?","options":["לוב","עיראק","לבנון","מצרים"],"answer":0,"explain":"הפולשות היו מצרים, עבר הירדן, סוריה, לבנון ועיראק. עיראק הייתה היחידה מהן שלא חתמה אחר כך על הסכם שביתת נשק.","difficulty":1,"source":"https://www.britannica.com/event/1948-Arab-Israeli-War"},{"id":"hist-018","cat":"history","q":"באיזה מבצע, שבסופו הגיע צה\"ל לאום רשרש (היום אילת), הסתיימה מלחמת העצמאות?","options":["יואב","חורב","נחשון","עובדה"],"answer":3,"explain":"המבצע נערך ב-5 עד 10 במרץ 1949, והשתתפו בו חטיבות הנגב, גולני ואלכסנדרוני. הכוחות כמעט לא נתקלו בהתנגדות בדרך.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Operation_Uvda"},{"id":"hist-019","cat":"history","q":"איך נקראה הדרך העוקפת שנפרצה במאי–יוני 1948 לירושלים הנצורה, אחרי שהלגיון הירדני חסם את הכביש בלטרון?","options":["דרך הגבורה","כביש הסרגל","דרך בורמה","דרך הפטרולים"],"answer":2,"explain":"השם נלקח מהדרך שנסללה במלחמת העולם השנייה מבורמה לסין. השיירה הראשונה עברה בה בלילה שבין 31 במאי ל-1 ביוני 1948.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Burma_Road_(Israel)"},{"id":"hist-020","cat":"history","q":"מאיזו מדינה הגיעו מטוסי הקרב הראשונים של חיל האוויר, ה\"אוויה S-199\"?","options":["בריטניה","צ'כוסלובקיה","צרפת","ארצות הברית"],"answer":1,"explain":"אירוניה היסטורית: זו הייתה גרסה צ'כית של המסרשמיט 109 הגרמני. הגיחה המבצעית הראשונה, ב-29 במאי 1948, הייתה נגד הטור המצרי ליד אשדוד.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Avia_S-199"},{"id":"hist-021","cat":"history","q":"למה יש בכנסת דווקא 120 חברים?","options":["כמספר חברי \"כנסת הגדולה\"","כמספר חותמי מגילת העצמאות","כך קבעה תוכנית החלוקה","חבר אחד לכל 5,000 בוחרים"],"answer":0,"explain":"\"כנסת הגדולה\" פעלה בימי שיבת ציון. הבחירות הראשונות נערכו ב-25 בינואר 1949, ושיעור ההצבעה היה כ-87 אחוז.","difficulty":2,"source":"https://en.wikipedia.org/wiki/1949_Israeli_Constituent_Assembly_election"},{"id":"hist-022","cat":"history","q":"עם אילו מדינות תיאמה ישראל בחשאי את מבצע קדש ב-1956?","options":["ארצות הברית ובריטניה","צרפת וירדן","ארצות הברית וצרפת","בריטניה וצרפת"],"answer":3,"explain":"הרקע היה הלאמת תעלת סואץ בידי נאצר. התיאום נקבע ב\"פרוטוקול סוור\", ובעקבות המבצע נפתחו מצרי טיראן לשיט ישראלי.","difficulty":1,"source":"https://www.britannica.com/event/Suez-Crisis"},{"id":"hist-023","cat":"history","q":"באיזו מדינה נלכד אדולף אייכמן ב-1960?","options":["ברזיל","פרגוואי","ארגנטינה","צ'ילה"],"answer":2,"explain":"משפטו נערך בבית העם בירושלים, והתובע היה גדעון האוזנר. זו ההוצאה להורג היחידה בישראל בעקבות פסק דין של בית משפט אזרחי.","difficulty":2,"source":"https://www.yadvashem.org/holocaust/eichmann-trial/about.html"},{"id":"hist-024","cat":"history","q":"מי היה ראש הממשלה במלחמת ששת הימים?","options":["דוד בן-גוריון","לוי אשכול","גולדה מאיר","מנחם בגין"],"answer":1,"explain":"שר הביטחון היה משה דיין והרמטכ\"ל יצחק רבין. הטעות הנפוצה היא לחשוב שבן-גוריון עדיין היה בתפקיד.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Six-Day_War"},{"id":"hist-025","cat":"history","q":"מי מסר בקשר את ההודעה \"הר הבית בידינו\" ב-1967?","options":["מוטה גור","משה דיין","עוזי נרקיס","יצחק רבין"],"answer":0,"explain":"גור היה אז מפקד חטיבת הצנחנים 55. אחר כך כיהן כרמטכ\"ל העשירי, מ-1974 עד 1978.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Mordechai_Gur"},{"id":"hist-026","cat":"history","q":"מה לקחו הצנחנים מהמצרים במבצע \"תרנגול 53\" ב-1969?","options":["סוללת טילים","טנק סובייטי חדש","מטוס מיג","מכ\"ם מצרי מתוצרת סובייטית"],"answer":3,"explain":"התוכנית המקורית הייתה להפציץ את המכ\"ם. במקום זה פירקו אותו והטיסו אותו תלוי מתחת למסוק, כארבעה טונות. המסוק ניזק מהעומס ונאלץ לנחות נחיתת חירום.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Operation_Rooster_53"},{"id":"hist-027","cat":"history","q":"כדי להבריח את ספינות שרבורג מצרפת ב-1969, הן \"נמכרו\" לחברה שהציגה את עצמה כ...","options":["חברת דיג יוונית","חברת יאכטות לתיירים","חברת קידוחי נפט נורווגית","מכון מחקר ימי שוודי"],"answer":2,"explain":"החברה, \"סטארבוט\", נרשמה בפנמה. הספינות, שישראל כבר שילמה עליהן, הפליגו בליל חג המולד, כשכולם חגגו, והגיעו לחיפה ב-31 בדצמבר.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Cherbourg_Project"},{"id":"hist-028","cat":"history","q":"איזו ועדה חקרה את מחדלי מלחמת יום הכיפורים?","options":["ועדת כהן","ועדת אגרנט","ועדת וינוגרד","ועדת שמגר"],"answer":1,"explain":"בעקבות הוועדה פרש הרמטכ\"ל דוד אלעזר, וגולדה מאיר התפטרה באפריל 1974.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Golda_Meir"},{"id":"hist-029","cat":"history","q":"במבצע אנטבה נסעו הלוחמים במרצדס שחורה, כמו זו של אידי אמין. מה כמעט הרס את התרגיל?","options":["אמין החליף לאחרונה למרצדס לבנה","למרצדס נגמר הדלק בדרך","נשארה על המכונית לוחית ישראלית","המרצדס לא נכנסה למטוס"],"answer":0,"explain":"שני זקיפים אוגנדים חשדו ועצרו את השיירה.","difficulty":2,"funny":true,"source":"https://en.wikipedia.org/wiki/Entebbe_raid"},{"id":"hist-030","cat":"history","q":"את הכור הגרעיני של איזו מדינה השמיד חיל האוויר במבצע \"אופרה\" ב-1981?","options":["סוריה","איראן","לוב","עיראק"],"answer":3,"explain":"שמונה מטוסי F-16 תקפו את הכור \"אוסיראק\" ליד בגדאד, והתקיפה עצמה ארכה פחות משתי דקות. הטייס הצעיר ביותר היה אילן רמון.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Operation_Opera"},{"id":"hist-031","cat":"history","q":"באיזו שנה ביצעה \"כיפת ברזל\" את היירוט המבצעי הראשון שלה?","options":["2006","2014","2011","1991"],"answer":2,"explain":"ב-7 באפריל 2011 יירט מיירט \"תמיר\" רקטת גראד שנורתה לעבר אשקלון. המערכת היא פיתוח של רפאל.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Iron_Dome"},{"id":"hist-032","cat":"history","q":"מי זכו בפרס נובל לשלום לשנת 1978?","options":["בגין, סאדאת וג'ימי קרטר","מנחם בגין ואנואר סאדאת","סאדאת וקרטר","מנחם בגין לבדו"],"answer":1,"explain":"קרטר תיווך בהסכמי קמפ דייוויד, שנחתמו אחרי 13 ימי דיונים, אבל לא נכלל בפרס הזה.","difficulty":2,"source":"https://www.nobelprize.org/prizes/peace/1978/summary/"},{"id":"hist-033","cat":"history","q":"היכן נחתם הסכם אוסלו הראשון, ב-13 בספטמבר 1993?","options":["בוושינגטון","באוסלו","במדריד","בקהיר"],"answer":0,"explain":"רק השיחות החשאיות נערכו באוסלו. החתימה הייתה בוושינגטון, בנוכחות יצחק רבין ויאסר ערפאת.","difficulty":2,"source":"https://www.britannica.com/topic/Oslo-Accords"},{"id":"hist-034","cat":"history","q":"לאילו שני שטחים בריבונות ירדן נקבע בהסכם השלום הסדר מיוחד ל-25 שנה?","options":["טאבה ואילת","חמת גדר והחרמון","לטרון והר הצופים","נהריים וצופר"],"answer":3,"explain":"ב-2018 הודיעה ירדן שלא תחדש את ההסדר. ההסכם כלל גם אספקה של 50 מיליון מ\"ק מים בשנה מישראל לירדן.","difficulty":3,"source":"https://en.wikipedia.org/wiki/Israel%E2%80%93Jordan_peace_treaty"},{"id":"hist-035","cat":"history","q":"את יהודי איזו מדינה העלה מבצע \"מרבד הקסמים\"?","options":["עיראק","מרוקו","תימן","אתיופיה"],"answer":2,"explain":"כ-49,000 עולים הוטסו מעדן ב-1949 עד 1950. השם הרשמי של המבצע, \"על כנפי נשרים\", לקוח מספר שמות.","difficulty":1,"source":"https://en.wikipedia.org/wiki/Operation_Magic_Carpet_(Yemen)"},{"id":"hist-036","cat":"history","q":"בטיסת השיא של מבצע שלמה התווספו נוסעים באוויר, בלי שום עצירה. איך?","options":["נמצאו נוסעים חבויים בתא המטען","שני תינוקות נולדו בזמן הטיסה","אנשי צוות נוספו לרשימה","נוסעים נספרו פעמיים"],"answer":1,"explain":"בכל המבצע נולדו שמונה תינוקות. בתוך 36 שעות הוטסו 14,325 מיהודי אתיופיה מאדיס אבבה לישראל.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Operation_Solomon"},{"id":"hist-037","cat":"history","q":"כשדן שכטמן גילה את הקוואזי-גבישים, חתן פרס נובל לינוס פאולינג זלזל בו. מה, לפי המסופר, אמר?","options":["\"אין קוואזי-גבישים, יש קוואזי-מדענים\"","\"תחזור כשתהיה לך מעבדה אמיתית\"","\"פרס נובל לא מחלקים על טעויות\"","\"זה לא גביש, זה לכלוך על העדשה\""],"answer":0,"explain":"ראש קבוצת המחקר של שכטמן אמר לו לחזור ולקרוא את ספר הלימוד, ואחר כך ביקש שיעזוב כי הוא \"מבייש\" את הקבוצה. ב-2011 זכה שכטמן לבדו בפרס נובל לכימיה על התגלית.","difficulty":2,"funny":true,"source":"https://en.wikipedia.org/wiki/Dan_Shechtman"},{"id":"hist-038","cat":"history","q":"מוקדמות מונדיאל 1958: ישראל ניצחה באזור אסיה-אפריקה בלי לשחק אף משחק. איך זה קרה?","options":["כל המשחקים בוטלו בגלל מלחמת סיני","היריבות נפסלו בגלל זיופי גילים","ההכרעה נעשתה בהגרלה","כל היריבות סירבו לשחק נגדה"],"answer":3,"explain":"פיפ\"א לא הסכימה שנבחרת תעלה למונדיאל בלי לשחק, וקבעה לישראל משחקי הכרעה מול ויילס. ויילס ניצחה 0 /wiki/Ofeq"},{"id":"hist-044","cat":"history","q":"מי אמר אחרי הניצחון על צסק\"א מוסקבה ב-1977: \"אנחנו על המפה, ואנחנו נשארים על המפה\"?","options":["מיקי ברקוביץ'","טל ברודי","רלף קליין","מוטי ארואסטי"],"answer":1,"explain":"המשחק נערך בעיירה וירטון שבבלגיה, כי ברית המועצות סירבה לשחק בתל אביב. באפריל אותה שנה זכתה מכבי תל אביב בגביע אירופה לראשונה.","difficulty":2,"source":"https://en.wikipedia.org/wiki/Tal_Brody"},{"id":"hist-045","cat":"history","q":"ב-1985 החליף השקל החדש את השקל. מה היה יחס ההמרה?","options":["שקל חדש אחד לאלף שקלים","שקל חדש אחד למאה שקלים","שקל חדש אחד לעשרה שקלים","שקל חדש אחד לעשרת אלפים"],"answer":0,"explain":"גם השקל עצמו החזיק מעמד רק חמש שנים וחצי: הוא החליף את הלירה ב-1980, ביחס של שקל אחד לעשר לירות.","difficulty":2,"source":"https://boi.org.il/en/economic-roles/banknotes-and-coins/first-series-of-the-new-sheqel/"},{"id":"fun-001","cat":"world","q":"מה משותף לראש ממשלת אירלנד, למשבר האקלים, למיה ח'ליפה ולדרום אפריקה?","options":["מועמדים לפרס נובל לשלום","נושאים לבגרות באזרחות 2027","דברים שעל הזין של ישראלים מאז 7 באוקטובר","קבוצות וואטסאפ שהשתקתי לשנה"],"answer":2,"explain":"ראש ממשלת אירלנד (תפקיד, לא אדם: שלושה כיהנו בתקופה): אירלנד הכירה במדינה פלסטינית במאי 2024 והצטרפה להליך נגד ישראל בהאג, וישראל סגרה את שגרירותה בדבלין.\nמשבר האקלים: גרטה תונברג, הפנים של תנועת האקלים, נעצרה פעמיים ב-2025 במשטים לעזה.\nמיה ח'ליפה: ב-7.10.2023 צייצה שמישהו צריך להגיד ל\"לוחמי החופש\" לצלם לרוחב, ו\"פלייבוי\" ניתקה איתה את הקשר.\nדרום אפריקה: הגישה נגד ישראל הליך בבית הדין הבינלאומי לצדק לפי אמנת הג'נוסייד, וישראל דוחה את ההאשמה.","difficulty":1,"funny":true,"joke":true,"source":"https://icj-cij.org/CASE/192"},{"id":"fun-002","cat":"world","q":"גמר האירוויזיון 2026. אירלנד מחרימה. מה שידרה הטלוויזיה הציבורית האירית במקום?","options":["\"Father Ted\", סיטקום ישן על כמרים","שידור חוזר של גמר ישן","משחק כדורגל גאלי","מבזק מזג אוויר מורחב"],"answer":0,"explain":"RTÉ ויתרה על התחרות ושידרה פרק של \"Father Ted\" שבו הכמרים טד ודוגל מתחרים באירוויזי
