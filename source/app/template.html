<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ידיעת הארץ: החידון של המילואים</title>
<meta name="description" content="חידון ידיעת הארץ: 310 שאלות בהיסטוריה, גיאוגרפיה, תנ״ך, מנהיגים, ציונות וידע עולם.">
<meta name="theme-color" content="#121E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ידיעת הארץ">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
/*__FONTS__*/
:root {
  --bg: #18261A;
  --scrim: rgba(10,18,12,0.72);
  --text: #EEF3E2;
  --sub: #DCE6CB;
  --bone: #E6EED4;
  --ink: #16231A;
  --red: #FF5533;
  --red-soft: #FF8A70;
  --green: #9BE38A;
  --line: rgba(230,238,212,0.5);
  --display: "Rubik Dirt", "Secular One", sans-serif;
  --body: "Secular One", "Arial Hebrew", sans-serif;
  --gap: clamp(8px, 1.6vh, 14px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--scrim), var(--scrim)), url("/*__TOPO__*/");
  background-size: cover, 390px 844px;
  background-position: center, center top;
  color: var(--text);
  font-family: var(--body);
  font-weight: 400;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; font-weight: 400; }
a { color: var(--bone); }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

.glass {
  background: linear-gradient(135deg, rgba(26,42,29,0.96), rgba(12,22,15,0.94));
  -webkit-backdrop-filter: blur(10px) saturate(160%);
  backdrop-filter: blur(10px) saturate(160%);
  border: 1px solid rgba(230,238,212,0.5);
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.35), 0 12px 28px rgba(0,0,0,0.5);
}

.screen {
  display: none;
  height: 100vh; height: 100dvh;
  max-width: 480px; margin: 0 auto;
  padding: max(16px, env(safe-area-inset-top)) 20px max(16px, env(safe-area-inset-bottom));
  flex-direction: column; gap: var(--gap);
  position: relative; overflow-y: auto;
}
.screen.active { display: flex; }

/* hexagon button (topics / exit) */
.hex { position: relative; width: 50px; height: 56px; padding: 0; border: 0; background: none; display: grid; place-items: center; flex: none; }
.hex svg.shape { position: absolute; inset: 0; }
.hex svg.icon { position: relative; }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex: none; }
.pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 18px; font-size: 14px; }
.dot { width: 8px; height: 8px; border-radius: 4px; background: var(--green); box-shadow: 0 0 8px var(--green); }

/* home */
.hero { position: relative; flex: none; }
.hero h1 { margin: 0; font: 400 clamp(46px, 8.2vh, 70px)/0.92 var(--display); }
.hero p { margin: 6px 0 0; font-size: clamp(15px, 2.1vh, 18px); color: var(--bone); }
.here { position: absolute; left: 4px; top: 8px; width: 120px; height: 76px; pointer-events: none; }
.here .ring { position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 17px; border: 2px solid var(--red); box-shadow: 0 0 18px rgba(255,85,51,0.8); }
.here .core { position: absolute; left: 12px; top: 12px; width: 10px; height: 10px; border-radius: 5px; background: var(--red); }
.here .leg { position: absolute; left: 30px; top: 30px; width: 30px; height: 1px; background: var(--red); transform: rotate(35deg); transform-origin: 0 0; }
.here .tag { position: absolute; left: 50px; top: 44px; padding: 3px 8px; border: 1px solid rgba(255,85,51,0.7); background: rgba(14,24,16,0.85); font-size: 12px; color: #FFB3A3; white-space: nowrap; }

.cta {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; flex: none;
  padding: clamp(12px, 1.9vh, 16px) 18px clamp(12px, 1.9vh, 16px) 12px;
  border: 0; border-radius: 28px; background: var(--bone); color: var(--ink); text-align: right;
  box-shadow: 0 14px 30px rgba(0,0,0,0.45), inset 0 -3px 0 rgba(0,0,0,0.12);
}
.cta .t { display: block; font: 400 clamp(24px, 3.6vh, 30px)/1 var(--display); }
.cta .s { display: block; font-size: 14px; color: #3A4A33; margin-top: 4px; }
.cta .go { flex: none; width: clamp(44px, 6.4vh, 54px); height: clamp(44px, 6.4vh, 54px); border-radius: 50%; background: var(--ink); color: var(--bone); display: grid; place-items: center; }
.cta:active { transform: translateY(1px); }

.label { font-size: 15px; color: var(--bone); flex: none; }

.route { position: relative; display: flex; flex-direction: column; gap: clamp(6px, 1.2vh, 10px); padding-right: 30px; flex: none; }
.route::before { content: ""; position: absolute; right: 10px; top: 20px; bottom: 20px; border-right: 2px dashed var(--line); }
.stop { position: relative; }
.stop .pin { position: absolute; right: -29px; top: 50%; margin-top: -8px; width: 16px; height: 16px; border-radius: 8px; border: 2px solid var(--bone); background: var(--bg); }
.stop:first-child .pin { border-color: var(--red); box-shadow: 0 0 12px rgba(255,85,51,0.7); }
.mode { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: clamp(46px, 6.6vh, 56px); padding: 6px 16px; border-radius: 18px; text-align: right; color: var(--text); }
.mode .n { display: block; font-size: 18px; line-height: 1.2; }
.mode .d { display: block; font-size: 13px; color: var(--sub); }
.mode .c { font: 400 26px var(--display); color: var(--red-soft); }
.mode:disabled { opacity: .45; cursor: default; }

.stats { margin-top: auto; padding: 10px 14px; border-radius: 14px; display: flex; flex-direction: column; gap: 7px; flex: none; font-size: 13px; }
.stats .row { display: flex; justify-content: space-between; }
.bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--bone); border-radius: 2px; }

/* quiz */
.counter { font: 400 clamp(24px, 3.4vh, 28px) var(--display); direction: ltr; white-space: nowrap; }
.track { position: relative; height: 44px; flex: none; }
.track .dash { position: absolute; right: 6px; left: 42px; top: 21px; border-top: 2px dashed var(--line); }
.track .fill { position: absolute; right: 6px; top: 20px; height: 4px; border-radius: 2px; background: var(--bone); transition: width .4s ease; }
.track .start { position: absolute; right: 0; top: 16px; width: 12px; height: 12px; border-radius: 6px; background: var(--bone); }
.track .tick { position: absolute; top: 18px; width: 8px; height: 8px; margin-right: -4px; border-radius: 4px; background: rgba(230,238,212,0.35); }
.track .tick.done { background: var(--bone); }
.track .home { position: absolute; left: 0; top: 4px; width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; color: var(--red); }
.track .me { position: absolute; top: 7px; width: 30px; height: 30px; margin-right: -15px; border-radius: 15px; border: 2px solid var(--red); background: #0E1A10; box-shadow: 0 0 18px rgba(255,85,51,0.85); display: grid; place-items: center; transition: right .4s ease; }
.track .me i { width: 10px; height: 10px; border-radius: 5px; background: var(--red); }
.caption { font-size: 13px; color: var(--sub); margin-top: calc(var(--gap) * -0.6); flex: none; }

.qcard { padding: clamp(12px, 1.9vh, 16px) 18px; border-radius: 20px; background: #EEF3E2; color: var(--ink); box-shadow: 0 16px 34px rgba(0,0,0,0.55); flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chip { padding: 2px 10px; border-radius: 999px; font-size: 12px; background: rgba(22,35,26,0.12); }
.chip.red { background: var(--red); color: #fff; }
.qtext { margin: 0; font: 400 clamp(19px, 2.8vh, 23px)/1.3 var(--body); }

.options { display: flex; flex-direction: column; gap: 8px; flex: none; }
.opt {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: clamp(44px, 6vh, 50px); padding: 8px 16px; border-radius: 16px;
  color: var(--text); font-size: 17px; line-height: 1.3; text-align: right;
  transition: background-color .15s, opacity .2s, max-height .3s ease, min-height .3s ease, padding .3s ease, margin .3s ease;
  max-height: 120px; overflow: hidden;
}
.opt svg { flex: none; }
.opt.right { background: var(--green); border-color: var(--green); color: #10200F; }
.opt.wrong { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 10px 24px rgba(255,85,51,0.35); }
.opt.punch { background: var(--bone); color: var(--ink); }
.opt.gone { max-height: 0; min-height: 0; padding-top: 0; padding-bottom: 0; margin-top: -8px; opacity: 0; border-width: 0; }
.opt:disabled { cursor: default; }

.feedback { padding: 12px 16px; border-radius: 18px; flex: 0 1 auto; min-height: 0; overflow-y: auto; }
.feedback h3 { margin: 0 0 4px; font: 400 clamp(22px, 3.2vh, 27px)/1.1 var(--display); }
.feedback h3.good { color: var(--green); }
.feedback h3.bad { color: var(--red-soft); }
.feedback h3.lol { color: var(--bone); }
.feedback p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--sub); }
.feedback a { font-size: 13px; }
.show { animation: rise .25s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.next { margin-top: auto; flex: none; display: flex; align-items: center; justify-content: center; gap: 10px; height: clamp(50px, 7vh, 58px); border: 0; border-radius: 28px; background: var(--bone); color: var(--ink); font: 400 clamp(22px, 3.2vh, 26px) var(--display); box-shadow: 0 14px 30px rgba(0,0,0,0.45), inset 0 -3px 0 rgba(0,0,0,0.12); }

/* results */
.score { margin-top: clamp(8px, 4vh, 40px); font: 400 clamp(96px, 17vh, 150px)/0.9 var(--display); direction: ltr; text-align: right; flex: none; }
.score small { font-size: .4em; color: var(--sub); }
.verdict { margin: 0; font-size: clamp(19px, 2.8vh, 23px); flex: none; }
.sub { margin: 0; color: var(--sub); flex: none; }
.breakdown { list-style: none; margin: 0; padding: 4px 16px; border-radius: 18px; flex: 0 1 auto; overflow-y: auto; min-height: 0; }
.breakdown li { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid rgba(230,238,212,0.2); }
.breakdown li:last-child { border-bottom: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: none; }
.ghost { height: 50px; border-radius: 18px; font-size: 16px; }

/* topics sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 10; }
.sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 480px; max-height: 86dvh; overflow-y: auto; z-index: 11; padding: 18px 20px max(20px, env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0; animation: up .25s ease; }
@keyframes up { from { transform: translate(-50%, 30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.sheet-head h2 { margin: 0; font: 400 30px var(--display); }
.close { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; }
.topic { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 2px; border: 0; border-bottom: 1px solid rgba(230,238,212,0.2); background: none; text-align: right; }
.topic .n { display: block; font-size: 18px; }
.topic .d { display: block; font-size: 13px; color: var(--sub); }
.topic .c { font: 400 24px var(--display); color: var(--red-soft); }
.sheet-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 14px; font-size: 14px; }
.link { background: none; border: 0; padding: 6px 0; text-decoration: underline; color: var(--sub); }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: 99px; background: var(--bone); color: var(--ink); font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; white-space: nowrap; }
.toast.on { opacity: 1; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.restart { align-self: flex-start; background: none; border: 0; padding: 2px 4px; margin-top: calc(var(--gap) * -0.5); font-size: 14px; color: var(--sub); text-decoration: underline; flex: none; }
.mode .chev { color: var(--sub); }
.brand { font-size: 14px; color: var(--sub); }
</style>
</head>
<body>

<!-- HOME -->
<section class="screen active" id="home">
  <div class="topbar">
    <span class="brand">החידון של המילואים</span>
    <button class="hex" id="topicsBtn" aria-label="נושאים">
      <svg class="shape" aria-hidden="true" width="50" height="56" viewBox="0 0 52 58"><path d="M26 2 L49 15 L49 43 L26 56 L3 43 L3 15 Z" fill="rgba(14,24,16,0.9)" stroke="rgba(230,238,212,0.7)" stroke-width="1.4"/></svg>
      <svg class="icon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
    </button>
  </div>

  <div class="hero">
    <div class="here" aria-hidden="true"><span class="ring"></span><span class="core"></span><span class="leg"></span><span class="tag">אתה כאן. בערך.</span></div>
    <h1>ידיעת<br>הארץ</h1>
    <p><span class="allN">310</span> שאלות על הארץ, התנ״ך, המנהיגים והעולם.</p>
  </div>

  <button class="cta" id="allBtn">
    <span><span class="t" id="mainT">כל <span class="allN">310</span> השאלות</span><span class="s" id="mainS">בסדר אקראי. אפשר לעצור באמצע.</span></span>
    <span class="go" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></span>
  </button>
  <button class="restart" id="restartAll" hidden>להתחיל מההתחלה</button>

  <span class="label">אפשר גם:</span>
  <div class="route">
    <div class="stop"><span class="pin"></span><button class="mode glass" id="funBtn"><span><span class="n">רק המצחיקות</span><span class="d" data-base="השאלות עם החיוך">השאלות עם החיוך</span></span><span class="c" id="funCount"></span></button></div>
    <div class="stop"><span class="pin"></span><button class="mode glass" id="hardBtn"><span><span class="n">רק הקשות</span><span class="d" data-base="למי שבא להתאמץ">למי שבא להתאמץ</span></span><span class="c" id="hardCount"></span></button></div>
    <div class="stop"><span class="pin"></span><button class="mode glass" id="levelBtn"><span><span class="n">לפי רמה</span><span class="d">קלות, בינוניות או קשות</span></span><svg class="chev" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button></div>
  </div>

  <div class="stats glass">
    <div class="row"><span id="statsA"></span><span id="statsB" style="color: var(--sub)"></span></div>
    <div class="bar"><i id="statsBar" style="width: 0%"></i></div>
  </div>
</section>

<!-- QUIZ -->
<section class="screen" id="quiz" aria-live="polite">
  <div class="topbar">
    <button class="hex" id="quitBtn" aria-label="לתפריט. ההתקדמות נשמרת">
      <svg class="shape" aria-hidden="true" width="50" height="56" viewBox="0 0 52 58"><path d="M26 2 L49 15 L49 43 L26 56 L3 43 L3 15 Z" fill="rgba(14,24,16,0.9)" stroke="rgba(230,238,212,0.7)" stroke-width="1.4"/></svg>
      <svg class="icon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
    <span class="counter" id="counter"></span>
    <span class="pill glass" id="scorePill">0 נכונות</span>
  </div>

  <div class="track" aria-hidden="true">
    <span class="dash"></span><span class="fill" id="fill"></span><span class="start"></span>
    <span class="home glass"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>
    <span class="me" id="me"><i></i></span>
  </div>
  <span class="caption" id="caption"></span>

  <div class="qcard">
    <div class="chips" id="chips"></div>
    <h2 class="qtext" id="qtext"></h2>
  </div>
  <div class="options" id="options"></div>

  <div class="feedback glass" id="feedback" hidden>
    <h3 id="fbTitle"></h3>
    <p><span id="fbText"></span> <a id="fbSrc" target="_blank" rel="noopener">מקור</a></p>
  </div>
  <button class="next" id="nextBtn" hidden><span id="nextLabel">הבאה</span><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
</section>

<!-- RESULTS -->
<section class="screen" id="results">
  <div class="score" id="scoreBig"></div>
  <p class="verdict" id="verdict"></p>
  <p class="sub" id="scoreSub"></p>
  <ul class="breakdown glass" id="breakdown"></ul>
  <button class="cta" id="againBtn" style="margin-top: auto">
    <span><span class="t">עוד פעם</span><span class="s">אותו משחק, בסדר אחר</span></span>
    <span class="go" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></span>
  </button>
  <div class="row2">
    <button class="ghost glass" id="shareBtn">לשתף</button>
    <button class="ghost glass" id="homeBtn">לתפריט</button>
  </div>
</section>

<!-- SHEET (topics or levels) -->
<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet glass" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <button class="close glass" id="sheetClose" aria-label="סגירה"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
  </div>
  <div id="sheetList"></div>
  <div class="sheet-foot" id="sheetFoot">
    <button class="link" id="installBtn" hidden>להתקין כאפליקציה</button>
    <span id="iosTip" hidden>להתקנה: שיתוף בספארי, ואז ״הוספה למסך הבית״</span>
    <button class="link" id="resetBtn">לאפס את ההתקדמות</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
const QUESTIONS = /*__QUESTIONS__*/[];
const BY_ID = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));

const CATS = { history: "היסטוריה", geography: "גיאוגרפיה", tanakh: "תנ״ך", leaders: "נשיאים וראשי ממשלה", zionism: "ציונות", world: "העולם" };
const LEVELS = { 1: "קלות", 2: "בינוניות", 3: "קשות" };
const DIFF = { 1: "קלה", 2: "בינונית", 3: "קשה" };
const RIGHT = ["נכון.", "נכון מאוד.", "בדיוק.", "יפה.", "צדקת."];
const WRONG = ["לא נכון.", "לא הפעם.", "טעות.", "פספוס."];

// ---------- progress, saved on this phone ----------
const STORE_KEY = "yediat-haaretz-v1";
function loadStore() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; s.q = s.q || {}; s.saved = s.saved || {}; return s; }
  catch (e) { return { q: {}, saved: {} }; }
}
function saveStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }
let store = loadStore();
const stat = (id) => store.q[id] || { seen: 0, right: 0 };

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id)); }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2400); }

// a "mode" is the set of questions you play through, start to finish
const MODES = {
  all:  { pool: () => QUESTIONS },
  fun:  { pool: () => QUESTIONS.filter(q => q.funny || q.joke) },
  hard: { pool: () => QUESTIONS.filter(q => q.difficulty === 3 && !q.joke) },
};
function poolFor(key) {
  if (MODES[key]) return MODES[key].pool();
  if (key.startsWith("lvl")) { const d = Number(key.slice(3)); return QUESTIONS.filter(q => (q.difficulty || 2) === d && !q.joke); }
  if (key.startsWith("cat:")) { const c = key.slice(4); return QUESTIONS.filter(q => q.cat === c); }
  return [];
}
// a saved game still in progress for this mode, if any
function savedGame(key) {
  const s = store.saved[key];
  if (!s) return null;
  const ids = s.ids.filter(id => BY_ID[id]);
  if (!ids.length || s.i >= ids.length || s.i === 0) return null;
  return { ...s, ids };
}

// ---------- playing ----------
let game = null;

function start(key, fresh) {
  closeSheet();
  const saved = fresh ? null : savedGame(key);
  if (saved) game = { key, ids: saved.ids, i: saved.i, score: saved.score, scored: saved.scored, picks: saved.picks || {} };
  else {
    const ids = shuffle(poolFor(key)).map(q => q.id);
    if (!ids.length) { toast("אין כאן שאלות עדיין."); return; }
    game = { key, ids, i: 0, score: 0, scored: 0, picks: {} };
  }
  game.answered = false;
  show("quiz");
  renderQuestion();
}

function persist() {
  store.saved[game.key] = { ids: game.ids, i: game.i, score: game.score, scored: game.scored, picks: game.picks };
  saveStore();
}

function setProgress(done) {
  const n = game.ids.length, f = done / n;
  $("fill").style.width = "calc((100% - 48px) * " + f + ")";
  $("me").style.right = "calc(6px + (100% - 48px) * " + f + ")";
  const left = n - done;
  $("caption").textContent = left <= 0 ? "סיימת." : left === 1 ? "נשארה שאלה אחת" : "נשארו " + left + " שאלות";
}

function renderQuestion() {
  const q = BY_ID[game.ids[game.i]], n = game.ids.length;
  game.answered = false;
  game.order = shuffle([0, 1, 2, 3].slice(0, q.options.length));
  $("counter").textContent = (game.i + 1) + "/" + n;
  $("scorePill").textContent = game.score + " נכונות";
  setProgress(game.i);

  const chips = $("chips"); chips.innerHTML = "";
  const chip = (txt, cls) => { const s = document.createElement("span"); s.className = "chip" + (cls ? " " + cls : ""); s.textContent = txt; chips.appendChild(s); };
  chip(CATS[q.cat] || q.cat);
  if (q.joke) chip("בדיחה, לא נספרת", "red");
  else { chip(DIFF[q.difficulty] || "בינונית"); if (q.funny) chip("עם חיוך", "red"); }

  $("qtext").textContent = q.q;
  const box = $("options"); box.innerHTML = "";
  game.order.forEach(idx => {
    const b = document.createElement("button");
    b.className = "opt glass"; b.dataset.idx = idx;
    const span = document.createElement("span"); span.textContent = q.options[idx];
    b.appendChild(span);
    b.addEventListener("click", () => answer(idx));
    box.appendChild(b);
  });
  $("feedback").hidden = true;
  $("nextBtn").hidden = true;
}

const CHECK = '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const CROSS = '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>';

function answer(idx) {
  if (game.answered) return;
  game.answered = true;
  const q = BY_ID[game.ids[game.i]], correct = idx === q.answer;

  document.querySelectorAll("#options .opt").forEach(b => {
    const bi = Number(b.dataset.idx);
    b.disabled = true;
    if (bi === q.answer) { b.classList.remove("glass"); b.classList.add(q.joke ? "punch" : "right"); if (!q.joke) b.insertAdjacentHTML("beforeend", CHECK); }
    else if (bi === idx) { b.classList.remove("glass"); b.classList.add("wrong"); b.insertAdjacentHTML("beforeend", CROSS); }
    else b.classList.add("gone");
  });

  const s = stat(q.id); s.seen++;
  const h = $("fbTitle");
  if (q.joke) { h.className = "lol"; h.textContent = correct ? "בדיוק הבדיחה." : "הבדיחה מסומנת למעלה."; }
  else {
    game.scored++; if (correct) { game.score++; s.right++; }
    h.className = correct ? "good" : "bad";
    h.textContent = pick(correct ? RIGHT : WRONG);
  }
  store.q[q.id] = s;
  game.picks[q.id] = idx;
  game.i++;            // saved as "next question", so leaving now keeps this answer
  persist();

  $("scorePill").textContent = game.score + " נכונות";
  $("fbText").textContent = q.explain || "";
  const src = $("fbSrc");
  if (q.source) { src.href = q.source; src.hidden = false; } else src.hidden = true;
  const fb = $("feedback"); fb.hidden = false; fb.scrollTop = 0;
  fb.classList.remove("show"); void fb.offsetWidth; fb.classList.add("show");

  const last = game.i >= game.ids.length;
  $("nextLabel").textContent = last ? "לסיכום" : "הבאה";
  $("nextBtn").hidden = false;
  setProgress(game.i);
  $("nextBtn").focus({ preventScroll: true });
}

function next() {
  if (game.i < game.ids.length) renderQuestion();
  else finish();
}

function quit() {
  if (game && game.i > 0 && game.i < game.ids.length) toast("נשמר. אפשר להמשיך מאותה שאלה.");
  renderHome(); show("home");
}

// ---------- results ----------
function verdictFor(p) {
  if (p === 1) return "מושלם.";
  if (p >= .8) return "מצוין.";
  if (p >= .6) return "יפה מאוד.";
  if (p >= .4) return "לא רע בכלל.";
  if (p > 0) return "יש עוד מה ללמוד. בשביל זה יש חידון.";
  return "אפס. גם זה הישג, מסוג מסוים.";
}

function finish() {
  delete store.saved[game.key];
  store.rounds = (store.rounds || 0) + 1; saveStore();
  const { score, scored } = game;
  $("scoreBig").innerHTML = score + "<small>/" + scored + "</small>";
  $("verdict").textContent = scored ? verdictFor(score / scored) : "רק בדיחות הפעם, בלי ניקוד.";
  const jokes = Object.keys(game.picks).filter(id => BY_ID[id] && BY_ID[id].joke).length;
  $("scoreSub").textContent = jokes ? "ועוד " + jokes + " בדיחות שלא נספרו." : "";
  const per = {};
  Object.entries(game.picks).forEach(([id, p]) => {
    const q = BY_ID[id]; if (!q || q.joke) return;
    per[q.cat] = per[q.cat] || [0, 0]; per[q.cat][1]++; if (p === q.answer) per[q.cat][0]++;
  });
  const ul = $("breakdown"); ul.innerHTML = "";
  Object.keys(per).forEach(c => {
    const li = document.createElement("li");
    const a = document.createElement("span"); a.textContent = CATS[c] || c;
    const b = document.createElement("span"); b.textContent = per[c][0] + " מתוך " + per[c][1];
    li.append(a, b); ul.appendChild(li);
  });
  ul.hidden = !Object.keys(per).length;
  show("results");
}

async function share() {
  const text = "עניתי נכון על " + game.score + " מתוך " + game.scored + " בחידון ידיעת הארץ. נסה בעצמך:";
  const url = location.href.split("#")[0];
  try { if (navigator.share) { await navigator.share({ title: "ידיעת הארץ", text, url }); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(text + " " + url); toast("הקישור הועתק."); } catch (e) { toast("לא הצלחתי להעתיק."); }
}

// ---------- home ----------
const accuracy = (qs) => {
  const seen = qs.filter(q => !q.joke && stat(q.id).seen);
  const pct = seen.length ? Math.round(seen.reduce((s, q) => s + stat(q.id).right / stat(q.id).seen, 0) / seen.length * 100) : 0;
  return { seen: seen.length, pct };
};
const resumeText = (key) => { const s = savedGame(key); return s ? "נעצרת בשאלה " + (s.i + 1) + " מתוך " + s.ids.length : null; };

function renderHome() {
  const total = QUESTIONS.length;
  document.querySelectorAll(".allN").forEach(e => e.textContent = total);
  const all = savedGame("all");
  $("mainT").innerHTML = all ? "להמשיך" : 'כל <span class="allN">' + total + "</span> השאלות";
  $("mainS").textContent = all ? "משאלה " + (all.i + 1) + " מתוך " + all.ids.length : "בסדר אקראי. אפשר לעצור באמצע.";
  $("restartAll").hidden = !all;
  $("funCount").textContent = MODES.fun.pool().length;
  $("hardCount").textContent = MODES.hard.pool().length;
  [["funBtn", "fun"], ["hardBtn", "hard"]].forEach(([btn, key]) => {
    const d = $(btn).querySelector(".d"); d.textContent = resumeText(key) || d.dataset.base;
  });
  const a = accuracy(QUESTIONS);
  $("statsA").textContent = a.seen ? "ענית על " + a.seen + " מתוך " + total : "עוד לא ענית על אף שאלה";
  $("statsB").textContent = a.seen ? a.pct + "% נכונות" : "";
  $("statsBar").style.width = Math.round(a.seen / total * 100) + "%";
}

// ---------- sheet: topics or levels ----------
function sheetRow(name, desc, count, onClick) {
  const b = document.createElement("button");
  b.className = "topic";
  b.innerHTML = '<span><span class="n"></span><span class="d"></span></span><span class="c"></span>';
  b.querySelector(".n").textContent = name;
  b.querySelector(".d").textContent = desc;
  b.querySelector(".c").textContent = count;
  b.addEventListener("click", onClick);
  return b;
}
function openSheet(kind) {
  const list = $("sheetList"); list.innerHTML = "";
  if (kind === "topics") {
    $("sheetTitle").textContent = "נושאים";
    Object.keys(CATS).forEach(c => {
      const key = "cat:" + c, qs = poolFor(key); if (!qs.length) return;
      const a = accuracy(qs);
      const desc = resumeText(key) || (a.seen ? "ענית על " + a.seen + ", " + a.pct + "% נכונות" : "עוד לא התחלת");
      list.appendChild(sheetRow(CATS[c], desc, qs.length, () => start(key)));
    });
  } else {
    $("sheetTitle").textContent = "לפי רמה";
    [1, 2, 3].forEach(d => {
      const key = "lvl" + d, qs = poolFor(key);
      const a = accuracy(qs);
      list.appendChild(sheetRow("שאלות " + LEVELS[d], resumeText(key) || (a.seen ? "ענית על " + a.seen + ", " + a.pct + "% נכונות" : "עוד לא התחלת"), qs.length, () => start(key)));
    });
  }
  $("sheetFoot").hidden = kind !== "topics";
  $("sheetBg").hidden = false; $("sheet").hidden = false; $("sheetClose").focus();
}
function closeSheet() { $("sheetBg").hidden = true; $("sheet").hidden = true; }

$("allBtn").onclick = () => start("all");
$("restartAll").onclick = () => start("all", true);
$("funBtn").onclick = () => start("fun");
$("hardBtn").onclick = () => start("hard");
$("levelBtn").onclick = () => openSheet("levels");
$("topicsBtn").onclick = () => openSheet("topics");
$("sheetClose").onclick = closeSheet;
$("sheetBg").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
$("nextBtn").onclick = next;
$("quitBtn").onclick = quit;
$("homeBtn").onclick = () => { renderHome(); show("home"); };
$("againBtn").onclick = () => start(game ? game.key : "all", true);
$("shareBtn").onclick = share;
$("resetBtn").onclick = () => {
  if (confirm("למחוק את כל ההתקדמות בטלפון הזה?")) { store = { q: {}, saved: {} }; saveStore(); renderHome(); openSheet("topics"); toast("ההתקדמות אופסה."); }
};

// install as an app
(function () {
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (standalone) return;
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) $("iosTip").hidden = false;
  addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    $("installBtn").hidden = false;
    $("installBtn").onclick = () => { e.prompt(); $("installBtn").hidden = true; };
  });
})();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

renderHome();
</script>
